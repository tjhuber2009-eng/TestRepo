name: Indicator Sentinel RSI2 Bootstrap

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run Sentinel plus RSI2 bootstrap frontier
        run: python indicator_validation/run_sentinel_rsi2_bootstrap.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_sentinel_rsi2_bootstrap.py indicator_validation/output_sentinel_rsi2_bootstrap/* > indicator_validation/SHA256SUMS_SENTINEL_RSI2_BOOTSTRAP.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-sentinel-rsi2-bootstrap
          path: |
            indicator_validation/output_sentinel_rsi2_bootstrap/
            indicator_validation/SHA256SUMS_SENTINEL_RSI2_BOOTSTRAP.txt
          if-no-files-found: error
          retention-days: 7
