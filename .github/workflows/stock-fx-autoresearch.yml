name: Atlas Forge Stock + FX AUTORESEARCH

on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: stock-fx-autoresearch
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        working-directory: atlas_forge_autoresearch

    steps:
      - name: Check out research source
        uses: actions/checkout@v7
        with:
          ref: atlas-forge-autoresearch
          fetch-depth: 0

      - name: Record research source SHA
        shell: bash
        run: echo "AUTORESEARCH_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas_forge_autoresearch/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore development-only expansion data cache
        uses: actions/cache@v6
        with:
          path: atlas_forge_autoresearch/data
          key: stock-fx-development-v1-${{ hashFiles('atlas_forge_autoresearch/stock_fx_config.json') }}

      - name: Restore persistent stock/FX state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/stock-fx-autoresearch-state:refs/remotes/origin/stock-fx-autoresearch-state || true
          if git rev-parse --verify refs/remotes/origin/stock-fx-autoresearch-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/stock-fx-autoresearch-state -- atlas_forge_autoresearch/stock_fx_state || true
            echo "restored stock/FX state"
          else
            echo "no prior stock/FX state; starting clean"
          fi

      - name: Restore YouTube Intelligence hypothesis feed
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/youtube-intelligence-atlas-state:refs/remotes/origin/youtube-intelligence-atlas-state || true
          mkdir -p atlas_forge_autoresearch/stock_fx_state
          if git rev-parse --verify refs/remotes/origin/youtube-intelligence-atlas-state >/dev/null 2>&1; then
            git show refs/remotes/origin/youtube-intelligence-atlas-state:atlas_youtube_state/youtube_intelligence_feed.jsonl > atlas_forge_autoresearch/stock_fx_state/youtube_intelligence_feed.jsonl 2>/dev/null || rm -f atlas_forge_autoresearch/stock_fx_state/youtube_intelligence_feed.jsonl
            git show refs/remotes/origin/youtube-intelligence-atlas-state:atlas_youtube_state/harvest-stats.json > atlas_forge_autoresearch/stock_fx_state/youtube_intelligence_harvest_stats.json 2>/dev/null || true
            echo "restored YouTube Intelligence feed"
          else
            echo "no YouTube Intelligence state branch"
          fi

      - name: Restore latest model tournament state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/model-tournament-state:refs/remotes/origin/model-tournament-state || true
          if git rev-parse --verify refs/remotes/origin/model-tournament-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/model-tournament-state -- atlas_forge_autoresearch/tournament_state || true
          fi

      - name: Integrity and universe-lock checks
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          test -n "$TIINGO_API_TOKEN"
          python -m compileall -q .
          python -m unittest -v test_autoresearch_integrity.py
          python - <<'PY'
          import continuous_runner as c
          c.configure_paths(
              "stock_fx_config.json",
              "stock_fx_state",
              "strategy_library/stock_fx_universe_plan.json",
          )
          tracks=c.build_tracks()
          counts={}
          for t in tracks:
              counts[t["target"]["market"]]=counts.get(t["target"]["market"],0)+1
          assert len(tracks)==1110, len(tracks)
          assert counts=={"stock":900,"forex":210}, counts
          assert not c.hidden_validation_allowed_by_universe_plan()
          print({"tracks":len(tracks),"by_market":counts,"hidden_validation":False})
          PY
          python oos_guard.py

      - name: Inspect quota-safe development data cache
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import continuous_runner as c

          c.configure_paths(
              "stock_fx_config.json",
              "stock_fx_state",
              "strategy_library/stock_fx_universe_plan.json",
          )
          tracks=c.build_tracks()
          unique={}
          for track in tracks:
              unique.setdefault(track["target"]["id"], track["target"])

          ready=[]
          missing=[]
          for target in sorted(unique.values(), key=lambda x:x["id"]):
              manifest=Path("data")/f"{target['id']}_1d.manifest.json"
              ok=False
              if manifest.exists():
                  try:
                      m=json.loads(manifest.read_text())
                      expected_end=(
                          __import__("datetime").datetime.strptime(
                              target.get("validation_start","2021-01-01"),
                              "%Y-%m-%d",
                          )
                          - __import__("datetime").timedelta(days=1)
                      ).strftime("%Y-%m-%d")
                      ok=(
                          m.get("source")==target.get("source")
                          and m.get("requested_start")==target.get("start","2017-08-17")
                          and m.get("requested_end")==expected_end
                          and m.get("final_oos_included") is False
                      )
                  except Exception:
                      ok=False
              (ready if ok else missing).append(target["id"])

          print({
              "development_datasets_ready":len(ready),
              "development_datasets_total":len(unique),
              "missing_sample":missing[:12],
              "policy":(
                  "while cache is incomplete, the runner hydrates only targets "
                  "actually visited (max 6 visits/run) to stay below Tiingo's "
                  "free hourly request budget; no bulk 37-symbol prefetch"
              ),
          })
          PY

      - name: Post-data OOS contamination guard
        run: python oos_guard.py

      - name: Advance stock/FX breadth research
        run: >
          python continuous_runner.py
          --config stock_fx_config.json
          --state-dir stock_fx_state
          --universe-plan strategy_library/stock_fx_universe_plan.json
          --iters-per-visit 2
          --max-visits 6
          --max-seconds 1800
          --breadth-target 10
          --depth-target 30
          --elite-target 60
          --depth-fraction 0.25
          --elite-fraction 0.20
          --model auto

      - name: Final OOS contamination guard
        run: python oos_guard.py

      - name: Build expansion report
        shell: python
        run: |
          import json, math
          from pathlib import Path
          p=json.loads(Path("stock_fx_state/progress.json").read_text())
          b=json.loads(Path("stock_fx_state/leaderboard_latest.json").read_text())
          rows=b.get("rows",[])[:20]
          out=[
              "# Atlas Forge Stock + FX AUTORESEARCH",
              "",
              f"Source SHA: **{__import__('os').environ.get('AUTORESEARCH_SOURCE_SHA','')}**",
              f"Phase: **{p.get('phase')}**",
              f"Tracks: **{p.get('runnable_track_count')}**",
              f"PBO ready: **{p.get('pbo_ready_track_count',0)}/{p.get('pbo_baselined_track_count',0)}**",
              f"Hidden validation allowed: **{p.get('hidden_validation_allowed_by_universe_plan')}**",
              "",
              "| # | Family | Target | Market | Profile | CAGR | Sharpe | DD | PF | PBO |",
              "|---:|---|---|---|---|---:|---:|---:|---:|---:|",
          ]
          def f(v,d=2):
              try:
                  x=float(v)
                  return f"{x:.{d}f}" if math.isfinite(x) else "—"
              except Exception:
                  return "—"
          for i,r in enumerate(rows,1):
              pbo=r.get("pbo")
              out.append(
                  f"| {i} | {r.get('family')} | {r.get('target')} | {r.get('market')} | "
                  f"{r.get('profile')} | {f(r.get('development_cagr_pct'))}% | "
                  f"{f(r.get('development_sharpe'),3)} | {f(r.get('development_max_dd_pct'))}% | "
                  f"{f(r.get('development_pf'),3)} | {f(None if pbo is None else 100*float(pbo),1)}% |"
              )
          Path("stock-fx-report.md").write_text("\n".join(out)+"\n")
          print("\n".join(out))
 
      - name: Persist stock/FX research state
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C stock-fx-autoresearch-state
          git add -f atlas_forge_autoresearch/stock_fx_state
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "Stock FX autoresearch state run $GITHUB_RUN_ID"
          fi
          git push --force-with-lease origin stock-fx-autoresearch-state

      - name: Upload expansion state
        uses: actions/upload-artifact@v7
        with:
          name: stock-fx-autoresearch-${{ github.run_id }}
          path: |
            atlas_forge_autoresearch/stock_fx_state/progress.json
            atlas_forge_autoresearch/stock_fx_state/leaderboard_latest.json
            atlas_forge_autoresearch/stock_fx_state/search_selections.json
            atlas_forge_autoresearch/stock_fx_state/cycles.jsonl
            atlas_forge_autoresearch/stock-fx-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Chain next stock/FX cycle when data cache is fully hydrated
        if: success()
        shell: bash
        working-directory: .
        run: |
          read -r phase ready total <<EOF
          $(python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path

          progress=json.loads(
              Path("atlas_forge_autoresearch/stock_fx_state/progress.json").read_text()
          )
          cfg=json.loads(
              Path("atlas_forge_autoresearch/stock_fx_config.json").read_text()
          )
          targets=[x for x in cfg["targets"] if x.get("enabled")]
          ready=0
          for target in targets:
              p=Path("atlas_forge_autoresearch/data")/f"{target['id']}_1d.manifest.json"
              if not p.exists():
                  continue
              try:
                  m=json.loads(p.read_text())
                  end=(
                      datetime.strptime(
                          target.get("validation_start","2021-01-01"),
                          "%Y-%m-%d",
                      ) - timedelta(days=1)
                  ).strftime("%Y-%m-%d")
                  if (
                      m.get("source")==target.get("source")
                      and m.get("requested_start")==target.get("start","2017-08-17")
                      and m.get("requested_end")==end
                      and m.get("final_oos_included") is False
                  ):
                      ready += 1
              except Exception:
                  pass
          print(progress.get("phase",""), ready, len(targets))
          PY
          )
          EOF
          echo "phase=$phase development_cache=$ready/$total"
          if test "$phase" = "expansion_pending" || test "$phase" = "complete" || test "$phase" = "validation"; then
            echo "stock/FX adaptive lane frozen at phase=$phase; not opening hidden validation"
          elif test "$ready" = "$total"; then
            echo "all development data cached; resuming fast chained research"
            gh workflow run stock-fx-autoresearch.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "development cache still hydrating; hourly schedule will resume the lane without exceeding Tiingo's free request budget"
          fi
