name: BTC Flip V3 Independent Audit

on:
  push:
    branches: [dual-signal-audit-2026-09]
    paths:
      - btc_flip_audit.py
      - btc_flip_audit_runner.py
      - .github/workflows/btc-flip-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dual-signal-audit-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests
      - run: python btc_flip_audit_runner.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-flip-v3-audit-results
          path: audit_output_btc_flip/
      - name: Publish compact results to audit branch
        run: |
          git pull --rebase origin dual-signal-audit-2026-09 || true
          mkdir -p audit_results_btc_flip_repro
          cp audit_output_btc_flip/summary.json audit_results_btc_flip_repro/
          cp audit_output_btc_flip/results.csv audit_results_btc_flip_repro/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit_results_btc_flip_repro
          git diff --cached --quiet || git commit -m 'Publish BTC Flip V3 reproduction results'
          git push origin HEAD:dual-signal-audit-2026-09
