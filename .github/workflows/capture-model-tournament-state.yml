name: Capture model tournament state

on:
  workflow_run:
    workflows:
      - Zero-fee AI strategy model tournament
    types:
      - completed

permissions:
  actions: write
  contents: write

jobs:
  capture:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TOURNAMENT_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch
          fetch-depth: 0

      - name: Download aggregate tournament artifact
        shell: bash
        run: |
          mkdir -p captured
          gh run download "$TOURNAMENT_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name tournament-round1-summary             --dir captured
          test -s captured/tournament-summary.json
          test -s captured/tournament-report.md

      - name: Persist tournament state branch
        shell: bash
        run: |
          mkdir -p moondev_autoresearch_reconstruction/tournament_state
          cp captured/tournament-summary.json moondev_autoresearch_reconstruction/tournament_state/tournament-summary.json
          cp captured/tournament-report.md moondev_autoresearch_reconstruction/tournament_state/tournament-report.md
          git fetch origin model-tournament-state:refs/remotes/origin/model-tournament-state || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C model-tournament-state
          git add -f moondev_autoresearch_reconstruction/tournament_state
          if git diff --cached --quiet; then
            echo "no tournament state changes"
          else
            git commit -m "Capture tournament state run $TOURNAMENT_RUN_ID"
          fi
          git push --force-with-lease origin model-tournament-state

      - name: Refresh private dashboard snapshot
        shell: bash
        run: |
          gh workflow run autoresearch-dashboard.yml             --repo "$GITHUB_REPOSITORY"             --ref main
