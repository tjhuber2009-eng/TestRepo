name: AUTORESEARCH v4 development bootstrap

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable V4 source commit or branch"
        required: false
        default: "autoresearch-v4-alpha-generation"
        type: string
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
        default: "autoresearch-v4-alpha-generation"

permissions:
  contents: write

concurrency:
  group: autoresearch-v4-development-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    defaults:
      run:
        working-directory: atlas_forge_autoresearch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Verify requested V4 source
        shell: bash
        run: |
          resolved="$(git rev-parse HEAD)"
          requested="${{ inputs.source_ref }}"
          if [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]] && [[ "$resolved" != "$requested" ]]; then
            echo "::error::V4 source mismatch: requested $requested, resolved $resolved"
            exit 1
          fi
          echo "Pinned V4 source: $resolved"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas_forge_autoresearch/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and run v4 integrity suite
        run: |
          python -m compileall -q v4 test_v4_alpha_generation.py test_evidence_data.py
          python -m unittest -v test_v4_alpha_generation.py test_evidence_data.py

      - name: Require Tiingo evidence token
        shell: bash
        run: |
          if test -z "$TIINGO_API_TOKEN"; then
            echo "::error::TIINGO_API_TOKEN repository secret is required for the evidence-bearing private bootstrap."
            exit 1
          fi

      - name: Restore verified V4 development evidence cache
        uses: actions/cache@v6
        with:
          path: atlas_forge_autoresearch/v4_data
          key: atlas-forge-v4-development-evidence-v1-${{ hashFiles('atlas_forge_autoresearch/v4/prepare_evidence_data.py', 'atlas_forge_autoresearch/prepare_market_data.py') }}

      - name: Prepare verified primary development data
        shell: python
        run: |
          import hashlib, json, subprocess, sys
          from pathlib import Path

          root=Path("v4_data")
          root.mkdir(exist_ok=True)

          def sha256(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda:f.read(1024*1024), b""):
                      h.update(block)
              return h.hexdigest()

          def valid(ident, source, symbol, start, end):
              csv_path=root/f"{ident}_1d.csv"
              manifest_path=root/f"{ident}_1d.manifest.json"
              if not csv_path.exists() or not manifest_path.exists():
                  return False
              try:
                  m=json.loads(manifest_path.read_text())
                  return (
                      m.get("source")==source
                      and str(m.get("symbol","")).upper()==symbol.upper()
                      and m.get("requested_start")==start
                      and m.get("requested_end")==end
                      and (
                          m.get("final_oos_included") is False
                          or m.get("oos_included") is False
                      )
                      and m.get("hidden_validation_included",False) is False
                      and m.get("csv_sha256")==sha256(csv_path)
                  )
              except Exception:
                  return False

          specs=[
              ("evidence","tiingo","QQQ","qqq","2010-01-01","2020-12-31"),
              ("evidence","tiingo","TQQQ","tqqq","2010-02-11","2020-12-31"),
              ("evidence","tiingo","SPY","spy","2010-01-01","2020-12-31"),
              ("evidence","tiingo","IEF","ief","2010-01-01","2020-12-31"),
              ("evidence","tiingo","GLD","gld","2010-01-01","2020-12-31"),
              ("evidence","tiingo","SHY","shy","2010-01-01","2020-12-31"),
              ("evidence","cboe_vix","VIX","vix","2010-01-01","2020-12-31"),
              ("market","binance","BTCUSDT","btc","2017-08-17","2020-12-31"),
              ("market","binance","ETHUSDT","eth","2017-08-17","2020-12-31"),
          ]
          reused=0
          acquired=0
          for kind,source,symbol,ident,start,end in specs:
              if valid(ident,source,symbol,start,end):
                  print(f"[evidence cache] verified reuse {ident} {source}")
                  reused += 1
                  continue
              if kind=="evidence":
                  cmd=[
                      sys.executable,"-m","v4.prepare_evidence_data",
                      "--source",source,"--symbol",symbol,"--id",ident,
                      "--start",start,"--end",end,"--output-dir","v4_data",
                  ]
              else:
                  cmd=[
                      sys.executable,"prepare_market_data.py",
                      "--source",source,"--symbol",symbol,"--id",ident,
                      "--start",start,"--end",end,"--output-dir","v4_data",
                  ]
              subprocess.run(cmd,check=True)
              assert valid(ident,source,symbol,start,end), (
                  f"newly prepared evidence failed manifest/hash verification: {ident}"
              )
              acquired += 1
          print({"verified_reuse":reused,"acquired":acquired,"total":len(specs)})

      - name: Prepare Yahoo shadow data for independent reconciliation
        shell: bash
        run: |
          python prepare_market_data.py --source yahoo --symbol QQQ  --id qqq  --start 2010-01-01 --end 2020-12-31 --output-dir v4_data_yahoo
          python prepare_market_data.py --source yahoo --symbol TQQQ --id tqqq --start 2010-02-11 --end 2020-12-31 --output-dir v4_data_yahoo
          python prepare_market_data.py --source yahoo --symbol SPY  --id spy  --start 2010-01-01 --end 2020-12-31 --output-dir v4_data_yahoo
          python prepare_market_data.py --source yahoo --symbol IEF  --id ief  --start 2010-01-01 --end 2020-12-31 --output-dir v4_data_yahoo
          python prepare_market_data.py --source yahoo --symbol GLD  --id gld  --start 2010-01-01 --end 2020-12-31 --output-dir v4_data_yahoo
          python prepare_market_data.py --source yahoo --symbol SHY  --id shy  --start 2010-01-01 --end 2020-12-31 --output-dir v4_data_yahoo

      - name: Prepare Yahoo adjusted-source parity data for frozen HR-DUAL
        shell: bash
        run: |
          python prepare_market_data.py --source yahoo --symbol QQQ  --id qqq  --start 2010-01-01 --end 2020-12-31 --yahoo-adjustment legacy_adjusted_close --output-dir v4_data_hr_dual_yahoo
          python prepare_market_data.py --source yahoo --symbol TQQQ --id tqqq --start 2010-02-11 --end 2020-12-31 --yahoo-adjustment legacy_adjusted_close --output-dir v4_data_hr_dual_yahoo
          python prepare_market_data.py --source yahoo --symbol TECL --id tecl --start 2010-02-11 --end 2020-12-31 --yahoo-adjustment legacy_adjusted_close --output-dir v4_data_hr_dual_yahoo
          python prepare_market_data.py --source yahoo --symbol IEF  --id ief  --start 2010-01-01 --end 2020-12-31 --yahoo-adjustment legacy_adjusted_close --output-dir v4_data_hr_dual_yahoo
          python prepare_market_data.py --source yahoo --symbol GLD  --id gld  --start 2010-01-01 --end 2020-12-31 --yahoo-adjustment legacy_adjusted_close --output-dir v4_data_hr_dual_yahoo
          python prepare_market_data.py --source yahoo --symbol SHY  --id shy  --start 2010-01-01 --end 2020-12-31 --yahoo-adjustment legacy_adjusted_close --output-dir v4_data_hr_dual_yahoo

      - name: Replay frozen HR-DUAL on development-only source-parity data
        run: python -m v4.hr_dual_locked --data-dir v4_data_hr_dual_yahoo --output v4_state/hr-dual-locked-yahoo.json

      - name: Reconcile primary data against Yahoo shadow
        run: |
          python -m v4.reconcile_evidence_data \
            --primary-dir v4_data \
            --reference-dir v4_data_yahoo \
            --ids qqq,tqqq,spy,ief,gld,shy \
            --output v4_state/data-reconciliation.json

      - name: Run real-data v4 development bootstrap
        run: python -m v4.live_bootstrap --data-dir v4_data --output v4_state/development-bootstrap.json

      - name: Attach data provenance and reconciliation status
        shell: python
        run: |
          import json
          from pathlib import Path

          state_path=Path("v4_state/development-bootstrap.json")
          state=json.loads(state_path.read_text())
          audit=json.loads(Path("v4_state/data-reconciliation.json").read_text())
          provenance={}
          for path in sorted(Path("v4_data").glob("*.manifest.json")):
              row=json.loads(path.read_text())
              provenance[row["id"]]={
                  "source": row["source"],
                  "symbol": row["symbol"],
                  "csv_sha256": row["csv_sha256"],
                  "adjustment_method": row.get("adjustment_method"),
                  "dividends_explicit": row.get("dividends_explicit"),
                  "provider_adjusted_return_diagnostic": row.get("provider_adjusted_return_diagnostic"),
              }
          hr_dual=json.loads(Path("v4_state/hr-dual-locked-yahoo.json").read_text())
          state["data_provider_policy"]="tiingo_equity_etf+cboe_vix+binance_crypto"
          state["data_provenance"]=provenance
          state["data_reconciliation"]=audit
          state.setdefault("prior_work_diagnostics", {})["hr_dual_alpha"]=hr_dual
          state["promotion_blocked"]=bool(audit["promotion_blocked"])
          state["evidence_status"]=(
              "data_reconciled"
              if audit["reconciliation_pass"]
              else "provisional_data_reconciliation_failed"
          )
          state_path.write_text(json.dumps(state,indent=2,sort_keys=True,allow_nan=False)+"\n")

      - name: Enforce development-only boundary
        shell: python
        run: |
          import json
          from pathlib import Path
          x=json.loads(Path("v4_state/development-bootstrap.json").read_text())
          assert x["protocol"]=="alpha_generation_v4"
          assert x["stage"]=="development_only"
          assert x["data_end"] <= "2020-12-31"
          assert x["hidden_validation_opened"] is False
          assert x["final_oos_opened"] is False
          assert x["data_reconciliation"]["hidden_validation_opened"] is False
          assert x["data_reconciliation"]["final_oos_opened"] is False
          h=x["prior_work_diagnostics"]["hr_dual_alpha"]
          assert h["stage"]=="development_only"
          assert h["authoritative_portfolio_eligible"] is False
          assert h["hidden_validation_opened"] is False
          assert h["final_oos_opened"] is False
          assert h["source_lock"]["implementation_blob_sha"]=="27a24f0bc1883c497af23ff3a27918e35f3f4c11"

      - name: Persist v4 development state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/autoresearch-v4-state:refs/remotes/origin/autoresearch-v4-state
          rm -rf ../v4-state-wt
          git worktree add -B autoresearch-v4-state ../v4-state-wt refs/remotes/origin/autoresearch-v4-state
          mkdir -p ../v4-state-wt/atlas_forge_autoresearch/v4_state
          cp atlas_forge_autoresearch/v4_state/development-bootstrap.json ../v4-state-wt/atlas_forge_autoresearch/v4_state/development-bootstrap.json
          cp atlas_forge_autoresearch/v4_state/data-reconciliation.json ../v4-state-wt/atlas_forge_autoresearch/v4_state/data-reconciliation.json
          cp atlas_forge_autoresearch/v4_state/hr-dual-locked-yahoo.json ../v4-state-wt/atlas_forge_autoresearch/v4_state/hr-dual-locked-yahoo.json
          cd ../v4-state-wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f atlas_forge_autoresearch/v4_state/development-bootstrap.json
          git add -f atlas_forge_autoresearch/v4_state/data-reconciliation.json
          git add -f atlas_forge_autoresearch/v4_state/hr-dual-locked-yahoo.json
          if ! git diff --cached --quiet; then
            git commit -m "V4 Tiingo development bootstrap run $GITHUB_RUN_ID"
            git push origin HEAD:autoresearch-v4-state
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: autoresearch-v4-development-${{ github.run_id }}
          path: |
            atlas_forge_autoresearch/v4_state/development-bootstrap.json
            atlas_forge_autoresearch/v4_state/data-reconciliation.json
            atlas_forge_autoresearch/v4_state/hr-dual-locked-yahoo.json
            atlas_forge_autoresearch/v4_data/*.manifest.json
            atlas_forge_autoresearch/v4_data_yahoo/*.manifest.json
            atlas_forge_autoresearch/v4_data_hr_dual_yahoo/*.manifest.json
          retention-days: 30
