name: Atlas Forge V4 profit benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/atlas-forge-v4-profit-benchmark-kick"

permissions:
  contents: read

concurrency:
  group: atlas-forge-v4-profit-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
    defaults:
      run:
        working-directory: atlas_forge_autoresearch
    steps:
      - name: Checkout benchmark request
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Preserve incumbent benchmark record
        shell: bash
        working-directory: .
        run: cp .github/atlas-forge-v4-incumbent.json "$RUNNER_TEMP/atlas-forge-v4-incumbent.json"

      - id: source
        name: Resolve immutable V4 source from benchmark kick
        shell: bash
        working-directory: .
        run: |
          source_ref="$(sed -n 's/^Source head: \([0-9a-fA-F]\{40\}\)$/\1/p' .github/atlas-forge-v4-profit-benchmark-kick | head -1)"
          if [[ ! "$source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Benchmark kick must contain a 40-hex 'Source head:' value"
            exit 1
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned V4 source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          fetch-depth: 0

      - name: Verify pinned benchmark source
        shell: bash
        working-directory: .
        run: |
          resolved="$(git rev-parse HEAD)"
          requested="${{ steps.source.outputs.source_ref }}"
          test "$resolved" = "$requested" || {
            echo "::error::Benchmark source mismatch: requested $requested, resolved $resolved"
            exit 1
          }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas_forge_autoresearch/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Require Tiingo evidence token
        shell: bash
        run: |
          test -n "$TIINGO_API_TOKEN" || {
            echo "::error::TIINGO_API_TOKEN required"
            exit 1
          }

      - name: Restore verified V4 development evidence cache
        uses: actions/cache@v6
        with:
          path: atlas_forge_autoresearch/v4_data
          key: atlas-forge-v4-development-evidence-v1-${{ hashFiles('atlas_forge_autoresearch/v4/prepare_evidence_data.py', 'atlas_forge_autoresearch/prepare_market_data.py') }}

      - name: Prepare development-only primary data
        shell: python
        run: |
          import hashlib, json, subprocess, sys
          from pathlib import Path

          root=Path("v4_data")
          root.mkdir(exist_ok=True)

          def sha256(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda:f.read(1024*1024), b""):
                      h.update(block)
              return h.hexdigest()

          def valid(ident, source, symbol, start, end):
              csv_path=root/f"{ident}_1d.csv"
              manifest_path=root/f"{ident}_1d.manifest.json"
              if not csv_path.exists() or not manifest_path.exists():
                  return False
              try:
                  m=json.loads(manifest_path.read_text())
                  return (
                      m.get("source")==source
                      and str(m.get("symbol","")).upper()==symbol.upper()
                      and m.get("requested_start")==start
                      and m.get("requested_end")==end
                      and m.get("final_oos_included") is False
                      and m.get("hidden_validation_included",False) is False
                      and m.get("csv_sha256")==sha256(csv_path)
                  )
              except Exception:
                  return False

          specs=[
              ("evidence","tiingo","QQQ","qqq","2010-01-01","2020-12-31"),
              ("evidence","tiingo","TQQQ","tqqq","2010-02-11","2020-12-31"),
              ("evidence","tiingo","SPY","spy","2010-01-01","2020-12-31"),
              ("evidence","tiingo","IEF","ief","2010-01-01","2020-12-31"),
              ("evidence","tiingo","GLD","gld","2010-01-01","2020-12-31"),
              ("evidence","tiingo","SHY","shy","2010-01-01","2020-12-31"),
              ("evidence","cboe_vix","VIX","vix","2010-01-01","2020-12-31"),
              ("market","binance","BTCUSDT","btc","2017-08-17","2020-12-31"),
              ("market","binance","ETHUSDT","eth","2017-08-17","2020-12-31"),
          ]
          reused=0
          acquired=0
          for kind,source,symbol,ident,start,end in specs:
              if valid(ident,source,symbol,start,end):
                  print(f"[evidence cache] verified reuse {ident} {source}")
                  reused += 1
                  continue
              if kind=="evidence":
                  cmd=[
                      sys.executable,"-m","v4.prepare_evidence_data",
                      "--source",source,"--symbol",symbol,"--id",ident,
                      "--start",start,"--end",end,"--output-dir","v4_data",
                  ]
              else:
                  cmd=[
                      sys.executable,"prepare_market_data.py",
                      "--source",source,"--symbol",symbol,"--id",ident,
                      "--start",start,"--end",end,"--output-dir","v4_data",
                  ]
              subprocess.run(cmd,check=True)
              assert valid(ident,source,symbol,start,end), (
                  f"newly prepared evidence failed manifest/hash verification: {ident}"
              )
              acquired += 1
          print({"verified_reuse":reused,"acquired":acquired,"total":len(specs)})

      - name: Run upgraded private profit benchmark
        run: >
          python -m v4.live_bootstrap
          --data-dir v4_data
          --output v4_state/profit-benchmark.json

      - name: Enforce sealed boundaries and print comparison
        shell: python
        run: |
          import json
          from pathlib import Path

          x=json.loads(Path("v4_state/profit-benchmark.json").read_text())
          assert x["protocol"]=="alpha_generation_v4"
          assert x["stage"]=="development_only"
          assert x["hidden_validation_opened"] is False
          assert x["final_oos_opened"] is False

          def chosen(container):
              if not container:
                  return None
              if "chosen" in container:
                  return container["chosen"]
              result=container.get("risk_scaled_result") or {}
              return result.get("chosen")

          summary={
              "research_commit_sha": x.get("research_commit_sha"),
              "selected_architecture": x.get("portfolio_selection"),
              "authoritative": chosen(x.get("portfolio")),
              "static": chosen(x.get("portfolio_static")),
              "satellite": chosen(x.get("portfolio_satellite")),
              "satellite_matched_static_gross": (
                  None if not x.get("portfolio_satellite")
                  else chosen(
                      x["portfolio_satellite"].get(
                          "matched_static_gross_result"
                      )
                  )
              ),
              "dynamic": chosen(x.get("portfolio_dynamic")),
              "dynamic_matched_static_gross": (
                  None if not x.get("portfolio_dynamic")
                  else chosen(
                      x["portfolio_dynamic"].get(
                          "matched_static_gross_result"
                      )
                  )
              ),
              "satellite_sleeve": (
                  None if not x.get("portfolio_satellite")
                  else x["portfolio_satellite"].get("sleeve")
              ),
              "financing_policy": x.get("portfolio_financing_policy"),
              "financing_sensitivity": {
                  rate: chosen(result)
                  for rate, result in (
                      x.get("portfolio_financing_sensitivity") or {}
                  ).items()
              },
              "eligible_strategy_names": x.get("eligible_strategy_names"),
              "hidden_validation_opened": x["hidden_validation_opened"],
              "final_oos_opened": x["final_oos_opened"],
          }
          Path("v4_state/profit-benchmark-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True)+"\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

      - name: Compare challenger with development incumbent
        shell: python
        run: |
          import json, os
          from pathlib import Path

          challenger=json.loads(
              Path("v4_state/profit-benchmark-summary.json").read_text()
          )
          incumbent=json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("atlas-forge-v4-incumbent.json")
              .read_text()
          )
          c=challenger["authoritative"]
          i=incumbent["financing"]["6"]
          stress=challenger.get("financing_sensitivity") or {}

          risk_ok=(
              float(c["bootstrap_dd_q95_pct"])
              <= float(incumbent["constraints"]["bootstrap_dd_q95_cap_pct"]) + 1e-4
              and float(c["max_realized_gross_exposure"])
              <= float(incumbent["constraints"]["max_gross"]) + 1e-4
          )
          growth_improved=(
              float(c["bootstrap_median_cagr_pct"])
              > float(i["bootstrap_median_cagr_pct"]) + 1e-12
          )
          q10_not_worse=(
              float(c["bootstrap_cagr_q10_pct"])
              >= float(i["bootstrap_cagr_q10_pct"]) - 1e-12
          )
          stress_ok=True
          stress_rows={}
          for rate in ("10","14"):
              row=stress.get(rate) or stress.get(rate+"%")
              if not row:
                  stress_ok=False
                  stress_rows[rate]={"available":False}
                  continue
              ok=(
                  float(row["cagr_pct"]) > 0
                  and float(row["bootstrap_cagr_q10_pct"]) > 0
                  and float(row["bootstrap_dd_q95_pct"])
                      <= float(incumbent["constraints"]["bootstrap_dd_q95_cap_pct"]) + 1e-4
                  and float(row["max_realized_gross_exposure"])
                      <= float(incumbent["constraints"]["max_gross"]) + 1e-4
              )
              stress_ok &= ok
              stress_rows[rate]={
                  "available":True,
                  "ok":bool(ok),
                  "cagr_pct":row["cagr_pct"],
                  "bootstrap_median_cagr_pct":row["bootstrap_median_cagr_pct"],
                  "bootstrap_cagr_q10_pct":row["bootstrap_cagr_q10_pct"],
                  "bootstrap_dd_q95_pct":row["bootstrap_dd_q95_pct"],
                  "max_realized_gross_exposure":row["max_realized_gross_exposure"],
              }

          auto_promote=bool(
              growth_improved and q10_not_worse and risk_ok and stress_ok
              and challenger["hidden_validation_opened"] is False
              and challenger["final_oos_opened"] is False
          )
          if auto_promote:
              decision="promote_development_incumbent"
          elif growth_improved and risk_ok and stress_ok:
              decision="review_growth_tail_tradeoff"
          else:
              decision="retain_development_incumbent"

          result={
              "decision":decision,
              "automatic_profit_incumbent_promotion":auto_promote,
              "incumbent_source_head":incumbent["source_head"],
              "challenger_source_head":challenger["research_commit_sha"],
              "checks":{
                  "bootstrap_median_growth_improved":growth_improved,
                  "bootstrap_q10_not_worse":q10_not_worse,
                  "risk_caps_ok":risk_ok,
                  "financing_stress_ok":stress_ok,
                  "sealed_boundaries_ok":(
                      challenger["hidden_validation_opened"] is False
                      and challenger["final_oos_opened"] is False
                  ),
              },
              "incumbent_6pct":i,
              "challenger_6pct":c,
              "stress":stress_rows,
          }
          Path("v4_state/profit-benchmark-decision.json").write_text(
              json.dumps(result, indent=2, sort_keys=True)+"\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))

      - uses: actions/upload-artifact@v7
        with:
          name: atlas-forge-v4-profit-benchmark-${{ github.run_id }}
          path: |
            atlas_forge_autoresearch/v4_state/profit-benchmark.json
            atlas_forge_autoresearch/v4_state/profit-benchmark-summary.json
            atlas_forge_autoresearch/v4_state/profit-benchmark-decision.json
          retention-days: 30
