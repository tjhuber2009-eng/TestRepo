name: MT5 Demo Harness CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "copytrader-forward-tester/mt5-demo/**"
      - ".github/workflows/mt5-demo-harness-ci.yml"
  push:
    branches: [main]
    paths:
      - "copytrader-forward-tester/mt5-demo/**"
      - ".github/workflows/mt5-demo-harness-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test analyzer and static demo-only guard
        run: python -m unittest discover -s copytrader-forward-tester/mt5-demo/tests -v
