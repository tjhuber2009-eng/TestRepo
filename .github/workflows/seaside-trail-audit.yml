name: SeaSide420 Trailing Stop Audit

on:
  push:
    branches: [dual-signal-audit-2026-09]
    paths:
      - seaside_trail_audit.py
      - .github/workflows/seaside-trail-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy requests
      - run: python seaside_trail_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seaside-trail-audit-results
          path: audit_output_seaside/
          if-no-files-found: warn
