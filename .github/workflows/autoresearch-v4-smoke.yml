name: AUTORESEARCH v4 alpha-generation smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/atlas-forge-v4-smoke-kick"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: atlas_forge_autoresearch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: autoresearch-v4-alpha-generation
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas_forge_autoresearch/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile v4 sources
        run: python -m compileall -q v4 test_v4_alpha_generation.py test_evidence_data.py

      - name: Run v4 integrity suite
        run: python -m unittest -v test_v4_alpha_generation.py test_evidence_data.py

      - name: Run end-to-end synthetic architecture demo
        run: python -m v4.campaign --demo --output v4_state/integration-demo.json

      - name: Assert synthetic demo did not open OOS
        shell: python
        run: |
          import json
          from pathlib import Path
          x=json.loads(Path("v4_state/integration-demo.json").read_text())
          assert x["protocol"]=="alpha_generation_v4"
          assert x["v3_outcomes_touched"] is False
          assert x["final_oos_opened"] is False

      - uses: actions/upload-artifact@v7
        with:
          name: autoresearch-v4-smoke-${{ github.run_id }}
          path: atlas_forge_autoresearch/v4_state/integration-demo.json
          retention-days: 14
