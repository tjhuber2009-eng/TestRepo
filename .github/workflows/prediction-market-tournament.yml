name: Prediction Market Tournament

on:
  push:
    branches: [prediction-market-tournament]
    paths:
      - "prediction_market_tournament/**"
      - ".github/workflows/prediction-market-tournament.yml"
  pull_request:
    paths:
      - "prediction_market_tournament/**"
      - ".github/workflows/prediction-market-tournament.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prediction-market-tournament-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prediction_market_tournament
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m pip install pytest
      - run: pytest -q
