name: Probe public caption fallbacks

on:
  push:
    branches: [main]
    paths:
      - ".github/yke-caption-probe-kick"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe trusted Invidious caption APIs
        shell: python
        run: |
          import json, urllib.request, urllib.parse, urllib.error
          instances=[
              'https://inv.nadeko.net',
              'https://invidious.nerdvpn.de',
              'https://yt.chocolatemoo53.com',
              'https://invidious.tiekoetter.com',
              'https://invidious.f5.si',
          ]
          videos=['_IaExNGNYg0','_BBjCdVfRvU','_jE9269Z5RQ']
          ok=[]
          for base in instances:
              for vid in videos:
                  url=f'{base}/api/v1/captions/{vid}'
                  try:
                      meta_url=f'{base}/api/v1/videos/{vid}'
                      try:
                          mreq=urllib.request.Request(meta_url,headers={'User-Agent':'Mozilla/5.0 AtlasForgeCaptionProbe/1.0'})
                          with urllib.request.urlopen(mreq,timeout=15) as mr:
                              mraw=mr.read(300000)
                          meta=json.loads(mraw)
                          print(json.dumps({'base':base,'video':vid,'status':'video_meta','title':str(meta.get('title',''))[:100],'published':meta.get('published'),'publishedText':meta.get('publishedText')}))
                      except Exception as me:
                          print(json.dumps({'base':base,'video':vid,'status':'video_meta_error','error':str(me)[:180]}))
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AtlasForgeCaptionProbe/1.0'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          raw=r.read(200000)
                          ct=r.headers.get('content-type','')
                      data=json.loads(raw)
                      caps=data.get('captions') or []
                      english=next((x for x in caps if str(x.get('languageCode','')).lower().startswith('en')),None)
                      print(json.dumps({'base':base,'video':vid,'status':'catalog_ok','caption_count':len(caps),'english':bool(english)}))
                      if english:
                          cap_url=urllib.parse.urljoin(base+'/',str(english.get('url') or ''))
                          print(json.dumps({'base':base,'video':vid,'status':'caption_url','url':cap_url[:300]}))
                          req=urllib.request.Request(cap_url,headers={'User-Agent':'Mozilla/5.0 AtlasForgeCaptionProbe/1.0'})
                          with urllib.request.urlopen(req,timeout=15) as r:
                              text=r.read(500000).decode('utf-8','replace')
                          good='-->' in text and len(text)>100
                          print(json.dumps({'base':base,'video':vid,'status':'vtt','good':good,'chars':len(text),'prefix':text[:80].replace('\\n',' ')}))
                          if good: ok.append((base,vid)); raise SystemExit(0)
                  except SystemExit:
                      raise
                  except Exception as e:
                      print(json.dumps({'base':base,'video':vid,'status':'error','error':str(e)[:240]}))
          raise SystemExit('No trusted public Invidious caption endpoint succeeded')
