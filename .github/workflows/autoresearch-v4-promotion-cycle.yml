name: Atlas Forge V4 promotion cycle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/atlas-forge-v4-kick"

permissions:
  actions: write
  contents: write

concurrency:
  group: autoresearch-v4-promotion-cycle
  cancel-in-progress: false

jobs:
  private-development:
    uses: ./.github/workflows/autoresearch-v4-bootstrap.yml
    secrets: inherit

  prop-development:
    needs: private-development
    uses: ./.github/workflows/autoresearch-v4-prop-intraday.yml
    secrets: inherit

  dashboard-refresh:
    needs: prop-development
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refresh dashboard with completed V4 state
        run: gh workflow run autoresearch-dashboard.yml --repo "$GITHUB_REPOSITORY" --ref main
