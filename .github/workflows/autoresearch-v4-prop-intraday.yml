name: AUTORESEARCH v4 prop intraday bootstrap

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: autoresearch-v4-prop-intraday
  cancel-in-progress: true

jobs:
  prop-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - uses: actions/checkout@v7
        with:
          ref: autoresearch-v4-alpha-generation
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and run v4 integrity suite
        run: |
          python -m compileall -q v4 test_v4_alpha_generation.py
          python -m unittest -v test_v4_alpha_generation.py

      - name: Prepare BTC 1h development proxy
        run: >
          python -m v4.prepare_binance_intraday
          --symbol BTCUSDT
          --id btc
          --interval 1h
          --start 2017-08-17
          --end 2020-12-31
          --output-dir v4_prop_intraday_data

      - name: Prepare ETH 1h development proxy
        run: >
          python -m v4.prepare_binance_intraday
          --symbol ETHUSDT
          --id eth
          --interval 1h
          --start 2017-08-17
          --end 2020-12-31
          --output-dir v4_prop_intraday_data

      - name: Prepare BNB 1h development proxy
        run: >
          python -m v4.prepare_binance_intraday
          --symbol BNBUSDT
          --id bnb
          --interval 1h
          --start 2017-08-17
          --end 2020-12-31
          --output-dir v4_prop_intraday_data

      - name: Prepare LTC 1h development proxy
        run: >
          python -m v4.prepare_binance_intraday
          --symbol LTCUSDT
          --id ltc
          --interval 1h
          --start 2017-08-17
          --end 2020-12-31
          --output-dir v4_prop_intraday_data

      - name: Run Prague-aligned prop optimization
        run: >
          python -m v4.prop_intraday_bootstrap
          --data-dir v4_prop_intraday_data
          --output v4_state/prop-intraday-bootstrap.json

      - name: Enforce sealed boundaries and proxy labels
        shell: python
        run: |
          import json
          from pathlib import Path
          x=json.loads(Path("v4_state/prop-intraday-bootstrap.json").read_text())
          assert x["track"]=="prop_firm_intraday"
          assert x["stage"]=="development_only"
          assert x["data_end"] <= "2020-12-31"
          assert x["hidden_validation_opened"] is False
          assert x["final_oos_opened"] is False
          assert x["reset_timezone"]=="Europe/Prague"
          assert all(
              not row["venue_execution_verified"]
              for row in x["market_mapping"].values()
          )

      - name: Persist intraday prop development state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/autoresearch-v4-state:refs/remotes/origin/autoresearch-v4-state
          rm -rf ../v4-prop-intraday-state-wt
          git worktree add -B autoresearch-v4-state ../v4-prop-intraday-state-wt refs/remotes/origin/autoresearch-v4-state
          mkdir -p ../v4-prop-intraday-state-wt/moondev_autoresearch_reconstruction/v4_state
          cp moondev_autoresearch_reconstruction/v4_state/prop-intraday-bootstrap.json ../v4-prop-intraday-state-wt/moondev_autoresearch_reconstruction/v4_state/prop-intraday-bootstrap.json
          cd ../v4-prop-intraday-state-wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f moondev_autoresearch_reconstruction/v4_state/prop-intraday-bootstrap.json
          if ! git diff --cached --quiet; then
            git commit -m "V4 prop intraday bootstrap run $GITHUB_RUN_ID"
            git push origin HEAD:autoresearch-v4-state
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: autoresearch-v4-prop-intraday-${{ github.run_id }}
          path: |
            moondev_autoresearch_reconstruction/v4_state/prop-intraday-bootstrap.json
            moondev_autoresearch_reconstruction/v4_prop_intraday_data/*.manifest.json
          retention-days: 30
