name: Continuous NVIDIA AUTORESEARCH

on:
  schedule:
    - cron: "17 * * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: continuous-nvidia-autoresearch
  cancel-in-progress: false

jobs:
  cycle:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.number == 13 &&
        github.event.comment.body == '/continuous-autoresearch-cycle' &&
        github.event.comment.user.login == 'tjhuber2009-eng'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify secret and compile
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          python -m compileall -q .
          python nvidia_smoke.py

      - name: Restore persistent research state
        shell: bash
        working-directory: .
        run: |
          git fetch origin continuous-autoresearch-state:refs/remotes/origin/continuous-autoresearch-state || true
          if git rev-parse --verify refs/remotes/origin/continuous-autoresearch-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/continuous-autoresearch-state -- moondev_autoresearch_reconstruction/continuous_state || true
            echo "restored persistent state"
          else
            echo "no prior state branch; starting clean"
          fi

      - name: Advance breadth-first research
        run: >
          python continuous_runner.py
          --batch-size 4
          --iters-per-visit 2
          --required-valid-attempts 10
          --model nvidia/nemotron-3-super-120b-a12b

      - name: Build cycle report
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path("continuous_state/leaderboard_latest.json")
          q=Path("continuous_state/first_pass_progress.json")
          if not p.exists() or not q.exists():
              raise SystemExit("leaderboard/progress missing")
          x=json.loads(p.read_text())
          progress=json.loads(q.read_text())
          rows=x.get("rows",[])[:10]
          out=[
              "# Continuous AUTORESEARCH cycle",
              "",
              f"Protocol: **{x.get('protocol')}**",
              f"Exhaustive runnable-track progress: **{progress.get('completed_track_count',0)}/{progress.get('runnable_track_count',0)}**",
              f"Validated tracks: **{progress.get('validated_track_count',0)}**; seed-rejected tracks: **{progress.get('seed_rejected_track_count',0)}**; pending: **{progress.get('pending_track_count',0)}**",
              f"Target: **{progress.get('required_valid_attempts_per_viable_track')} valid NVIDIA candidates per viable track** (CRASH rows do not count).",
              f"Special-engine families still blocked: **{progress.get('blocked_family_count',0)}**",
              "",
              "| Rank | Family | Target | Profile | Attempts | Score | Return | Sharpe | DD | PF |",
              "|---:|---|---|---|---:|---:|---:|---:|---:|---:|",
          ]
          for i,r in enumerate(rows,1):
              out.append(
                  f"| {i} | {r.get('family')} | {r.get('target')} | {r.get('profile')} | "
                  f"{r.get('attempts')} | {r.get('score')} | {r.get('return_pct')}% | "
                  f"{r.get('sharpe')} | {r.get('max_dd_pct')}% | {r.get('pf')} |"
              )
          out += [
              "",
              "Selection uses chronological pre-2023 robustness; 2023+ OOS remains sealed.",
              "The scheduler advances up to four incomplete family/market/profile tracks per cycle and runs up to two NVIDIA experiments per visit.",
              "Completed viable tracks are not repeated during this exhaustive pass. Failed/CRASH-only tracks remain pending and are retried.",
              "Seed strategies that cannot pass the hard chronological risk/robustness gate are recorded as tested/rejected rather than silently skipped.",
          ]
          Path("cycle-report.md").write_text("\n".join(out)+"\n")
          print("\n".join(out))

      - name: Persist state branch
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C continuous-autoresearch-state
          git add -f moondev_autoresearch_reconstruction/continuous_state
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "Continuous autoresearch state run $GITHUB_RUN_ID"
          fi
          git push --force-with-lease origin continuous-autoresearch-state

      - name: Notify once when runnable exhaustive pass completes
        shell: bash
        working-directory: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("moondev_autoresearch_reconstruction/continuous_state/first_pass_progress.json")
          x=json.loads(p.read_text())
          marker=Path("moondev_autoresearch_reconstruction/continuous_state/RUNNABLE_FIRST_PASS_COMPLETE")
          if x.get("runnable_first_pass_complete") and not marker.exists():
              marker.write_text(x.get("updated_at","")+"\n")
              Path("completion-note.md").write_text(
                  "# Continuous AUTORESEARCH runnable pass complete\n\n"
                  f"Completed tracks: **{x['completed_track_count']}/{x['runnable_track_count']}**.\n\n"
                  f"Every viable track reached at least **{x['required_valid_attempts_per_viable_track']} valid NVIDIA candidates**; "
                  "seed-invalid tracks were recorded as tested/rejected. CRASH rows did not count toward completion.\n\n"
                  f"Special-engine families still explicitly blocked/pending: **{x['blocked_family_count']}**.\n\n"
                  "2023+ OOS remained sealed throughout this pass.\n"
              )
              print("NOTIFY_COMPLETION=1")
          else:
              print("NOTIFY_COMPLETION=0")
          PY
          if grep -q '^NOTIFY_COMPLETION=1
        with:
          name: continuous-autoresearch-${{ github.run_id }}
          path: |
            moondev_autoresearch_reconstruction/continuous_state/leaderboard_latest.json
            moondev_autoresearch_reconstruction/continuous_state/first_pass_progress.json
            moondev_autoresearch_reconstruction/continuous_state/cycles.jsonl
            moondev_autoresearch_reconstruction/cycle-report.md
          retention-days: 14

      - name: Comment manual cycle result
        if: github.event_name == 'issue_comment'
        shell: bash
        working-directory: .
        run: >
          gh pr comment 13
          --repo tjhuber2009-eng/TestRepo
          --body-file moondev_autoresearch_reconstruction/cycle-report.md
 <(python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("moondev_autoresearch_reconstruction/continuous_state/first_pass_progress.json").read_text())
          print("NOTIFY_COMPLETION=1" if x.get("runnable_first_pass_complete") and Path("completion-note.md").exists() else "NOTIFY_COMPLETION=0")
          PY
          ); then
            gh pr comment 13 --repo tjhuber2009-eng/TestRepo --body-file completion-note.md
          fi

      - name: Upload current leaderboard
        uses: actions/upload-artifact@v4
        with:
          name: continuous-autoresearch-${{ github.run_id }}
          path: |
            moondev_autoresearch_reconstruction/continuous_state/leaderboard_latest.json
            moondev_autoresearch_reconstruction/continuous_state/first_pass_progress.json
            moondev_autoresearch_reconstruction/continuous_state/cycles.jsonl
            moondev_autoresearch_reconstruction/cycle-report.md
          retention-days: 14

      - name: Comment manual cycle result
        if: github.event_name == 'issue_comment'
        shell: bash
        working-directory: .
        run: >
          gh pr comment 13
          --repo tjhuber2009-eng/TestRepo
          --body-file moondev_autoresearch_reconstruction/cycle-report.md
