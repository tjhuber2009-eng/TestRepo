name: Historical Provider Benchmark (Manual Only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "copytrader-forward-tester/forward_test.py"
      - "copytrader-forward-tester/config/**"
      - ".github/workflows/copytrader-forward-test.yml"

permissions:
  contents: read

jobs:
  historical-provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen historical provider baseline
        run: python copytrader-forward-tester/forward_test.py verify
      - name: Run built-in self-test
        run: python copytrader-forward-tester/forward_test.py self-test
