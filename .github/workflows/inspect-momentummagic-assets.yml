name: Inspect MomentumMagic Public Assets

on:
  push:
    branches: [dual-signal-audit-2026-09]
    paths:
      - inspect_momentummagic_assets.py
      - .github/workflows/inspect-momentummagic-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dual-signal-audit-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Ensure English screenshot text extractor
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr >/dev/null
          fi
      - run: python inspect_momentummagic_assets.py
      - name: Publish inspection result to audit branch
        run: |
          mkdir -p audit_results_momentummagic
          cp momentummagic_public_inspection.json audit_results_momentummagic/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit_results_momentummagic/momentummagic_public_inspection.json
          git diff --cached --quiet || git commit -m 'Publish MomentumMagic public inspection'
          git push origin HEAD:dual-signal-audit-2026-09
