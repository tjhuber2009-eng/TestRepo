name: Indicator Union Robustness

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run corrected union robustness
        run: python indicator_validation/run_union_robustness.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_union_robustness.py indicator_validation/output_union_robustness/* > indicator_validation/SHA256SUMS_UNION_ROBUSTNESS.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-union-robustness
          path: |
            indicator_validation/output_union_robustness/
            indicator_validation/SHA256SUMS_UNION_ROBUSTNESS.txt
          if-no-files-found: error
          retention-days: 7
