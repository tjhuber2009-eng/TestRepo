name: NVIDIA AUTORESEARCH parallel prop/private 50

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  research:
    if: >
      github.event.issue.pull_request &&
      github.event.issue.number == 13 &&
      github.event.comment.body == '/nvidia-parallel-50' &&
      github.event.comment.user.login == 'tjhuber2009-eng'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: prop
            max_dd: "10.0"
            seed: strategy_prop_seed.py
          - profile: private
            max_dd: "32.0"
            seed: strategy_private_seed.py
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: nvidia/nemotron-3-super-120b-a12b
      AUTORESEARCH_PROFILE: ${{ matrix.profile }}
      AUTORESEARCH_MAX_DD_PCT: ${{ matrix.max_dd }}
      RUN_ID: ${{ github.run_id }}
      PROFILE: ${{ matrix.profile }}
    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall -q .

      - name: Verify NVIDIA secret
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          echo "NVIDIA_API_KEY present; profile=$PROFILE; max_dd=$AUTORESEARCH_MAX_DD_PCT%"

      - name: NVIDIA smoke test
        run: python nvidia_smoke.py

      - name: Prepare checksum-verified sealed IS data
        run: python prepare_data.py --asset ETH --end 2022-12-31

      - name: Install independent profile seed
        shell: bash
        run: |
          cp "${{ matrix.seed }}" strategy.py
          rm -f baseline.json last_run.json results.tsv proposal.txt STOP strategy_best.py
          rm -rf keepers logs
          mkdir -p keepers logs

      - name: Freeze profile baseline
        id: baseline
        shell: bash
        run: |
          set -o pipefail
          python harness.py --is --set-baseline 2>&1 | tee "${PROFILE}-baseline.log"
          cp strategy.py strategy_best.py
          cp strategy.py keepers/000_seed.py

      - name: Audit profile baseline
        shell: python
        run: |
          import json, os
          from pathlib import Path
          x=json.loads(Path("baseline.json").read_text())
          limit=float(os.environ["AUTORESEARCH_MAX_DD_PCT"])
          if not x["guard_ok"]:
              raise SystemExit(f"baseline guard failed: {x['guard_reason']}")
          if x["max_dd_pct"] < -limit:
              raise SystemExit(
                  f"baseline DD {x['max_dd_pct']}% exceeds {limit}%"
              )
          if x["trades"] < 50:
              raise SystemExit("baseline has fewer than 50 trades")
          Path(f"{os.environ['PROFILE']}-seed.json").write_text(
              json.dumps(x, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(x)

      - name: Run 50 independent NVIDIA iterations
        id: research
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python loop.py --iters 50 --model "$NVIDIA_MODEL" 2>&1 | tee "${PROFILE}-campaign.log"

      - name: Audit 50-run ledger
        id: ledger
        if: always()
        continue-on-error: true
        shell: python
        run: |
          import csv, os
          from pathlib import Path
          p=Path("results.tsv")
          if not p.exists():
              raise SystemExit("results.tsv missing")
          rows=list(csv.DictReader(p.open(encoding="utf-8"), delimiter="\t"))
          print(f"profile={os.environ['PROFILE']} rows={len(rows)}")
          if len(rows) != 50:
              raise SystemExit(f"expected 50 rows, found {len(rows)}")
          crashes=[r for r in rows if r["verdict"]=="CRASH"]
          print(f"crashes={len(crashes)}")
          if len(crashes) > 5:
              raise SystemExit(f"too many crashes: {len(crashes)}")

      - name: Package profile result
        if: always()
        shell: python
        env:
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
          LEDGER_OUTCOME: ${{ steps.ledger.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          import csv, json, os, shutil
          from pathlib import Path

          profile=os.environ["PROFILE"]
          run_id=os.environ["RUN_ID"]
          limit=float(os.environ["AUTORESEARCH_MAX_DD_PCT"])
          out=Path("parallel_export")
          out.mkdir(exist_ok=True)

          rows=[]
          if Path("results.tsv").exists():
              rows=list(csv.DictReader(
                  Path("results.tsv").open(encoding="utf-8"),
                  delimiter="\t",
              ))
          kept=[r for r in rows if r.get("verdict")=="KEPT"]
          rejected=[r for r in rows if r.get("verdict")=="REJECTED"]
          crashes=[r for r in rows if r.get("verdict")=="CRASH"]

          seed={}
          sp=Path(f"{profile}-seed.json")
          if sp.exists():
              seed=json.loads(sp.read_text())
          final={}
          bp=Path("baseline.json")
          if bp.exists():
              final=json.loads(bp.read_text())

          summary={
              "run_id": run_id,
              "profile": profile,
              "max_dd_limit_pct": limit,
              "iterations": len(rows),
              "kept": len(kept),
              "rejected": len(rejected),
              "crashes": len(crashes),
              "research_outcome": os.environ.get("RESEARCH_OUTCOME"),
              "ledger_outcome": os.environ.get("LEDGER_OUTCOME"),
              "seed": seed,
              "final": final,
          }
          (out/"summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True)+"\n",
              encoding="utf-8",
          )

          lines=[
              f"# {profile.upper()} AUTORESEARCH — 50 iterations",
              "",
              f"Run: {os.environ.get('RUN_URL','')}",
              f"Hard max drawdown: **{limit:.1f}%**",
              "- Data: checksum-verified ETHUSDT 6h, 2017-08-17 through 2022-12-31",
              "- OOS 2023+ remained sealed",
              "",
              f"- iterations: **{len(rows)}**",
              f"- kept: **{len(kept)}**",
              f"- rejected: **{len(rejected)}**",
              f"- crashes: **{len(crashes)}**",
              "",
          ]
          if seed:
              lines += [
                  "## Seed",
                  "",
                  f"- K: {seed['score']}",
                  f"- return: {seed['return_pct']}%",
                  f"- Sharpe: {seed['sharpe']}",
                  f"- max DD: {seed['max_dd_pct']}%",
                  f"- annualized vol: {seed['ann_vol_pct']}%",
                  "",
              ]
          if final:
              lines += [
                  "## Final champion",
                  "",
                  f"- K: **{final['score']}**",
                  f"- return: **{final['return_pct']}%**",
                  f"- Sharpe: **{final['sharpe']}**",
                  f"- max DD: **{final['max_dd_pct']}%**",
                  f"- annualized vol: **{final['ann_vol_pct']}%**",
                  f"- trades: **{final['trades']}**",
                  f"- PF: **{final['pf']}**",
                  "",
              ]
          lines += ["## Kept improvements", ""]
          if kept:
              for r in kept:
                  lines.append(
                      f"- iter {r['iter']}: K {r['base_score']} -> {r['score']} "
                      f"| return {r['ret_pct']}% | DD {r['max_dd']}% | {r['desc']}"
                  )
          else:
              lines.append("- none")
          lines += [
              "",
              "These are in-sample optimization results, not evidence of future profitability.",
          ]
          (out/"REPORT.md").write_text("\n".join(lines)+"\n", encoding="utf-8")

          for src,dst in [
              ("results.tsv","results.tsv"),
              ("baseline.json","final_baseline.json"),
              ("last_run.json","last_run.json"),
              ("strategy_best.py","strategy_best.py"),
              ("strategy.py","strategy.py"),
              (f"{profile}-seed.json","seed.json"),
              (f"{profile}-campaign.log","campaign.log"),
              (f"{profile}-baseline.log","baseline.log"),
          ]:
              p=Path(src)
              if p.exists():
                  shutil.copy2(p,out/dst)
          if Path("keepers").exists():
              shutil.copytree("keepers", out/"keepers", dirs_exist_ok=True)

      - name: Upload profile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-${{ matrix.profile }}-${{ github.run_id }}
          path: moondev_autoresearch_reconstruction/parallel_export/
          if-no-files-found: error
          retention-days: 30

      - name: Fail profile job on research/audit failure
        if: always()
        shell: bash
        run: |
          test "${{ steps.research.outcome }}" = "success"
          test "${{ steps.ledger.outcome }}" = "success"

  aggregate:
    needs: research
    if: always() && github.event.issue.pull_request && github.event.issue.number == 13 && github.event.comment.body == '/nvidia-parallel-50' && github.event.comment.user.login == 'tjhuber2009-eng'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch
          fetch-depth: 0

      - name: Download prop artifact
        uses: actions/download-artifact@v4
        with:
          name: parallel-prop-${{ github.run_id }}
          path: moondev_autoresearch_reconstruction/parallel_runs/${{ github.run_id }}/prop

      - name: Download private artifact
        uses: actions/download-artifact@v4
        with:
          name: parallel-private-${{ github.run_id }}
          path: moondev_autoresearch_reconstruction/parallel_runs/${{ github.run_id }}/private

      - name: Build comparison report
        working-directory: moondev_autoresearch_reconstruction
        shell: python
        run: |
          import json, os
          from pathlib import Path

          run_id=os.environ["RUN_ID"]
          root=Path("parallel_runs")/run_id
          summaries={}
          for profile in ["prop","private"]:
              p=root/profile/"summary.json"
              summaries[profile]=json.loads(p.read_text())

          lines=[
              "# Parallel AUTORESEARCH comparison",
              "",
              f"Run ID: {run_id}",
              "",
              "| Profile | DD cap | Seed K | Seed return | Seed DD | Final K | Final return | Final DD | Sharpe | PF | Kept | Crashes |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for profile in ["prop","private"]:
              x=summaries[profile]
              s=x["seed"]
              f=x["final"]
              lines.append(
                  f"| {profile} | {x['max_dd_limit_pct']}% | "
                  f"{s.get('score','')} | {s.get('return_pct','')}% | {s.get('max_dd_pct','')}% | "
                  f"{f.get('score','')} | {f.get('return_pct','')}% | {f.get('max_dd_pct','')}% | "
                  f"{f.get('sharpe','')} | {f.get('pf','')} | {x['kept']} | {x['crashes']} |"
              )
          lines += [
              "",
              "Both searches used the same verified ETH 6-hour IS data and scoring framework,",
              "but maintained independent seeds, baselines, volatility bands, keeper chains,",
              "and hard drawdown limits. OOS 2023+ remained sealed.",
              "",
          ]
          report="\n".join(lines)
          (root/"COMPARISON.md").write_text(report+"\n", encoding="utf-8")
          Path("parallel-comment.md").write_text(report+"\n", encoding="utf-8")

      - name: Archive both runs on one result branch
        shell: bash
        run: |
          BRANCH="nvidia-parallel-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "moondev_autoresearch_reconstruction/parallel_runs/${RUN_ID}"
          git commit -m "Archive parallel AUTORESEARCH run ${RUN_ID}"
          git push origin "$BRANCH"
          echo "RESULT_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Comment comparison on PR
        shell: bash
        run: |
          {
            cat moondev_autoresearch_reconstruction/parallel-comment.md
            echo
            echo "Archived branch: \`$RESULT_BRANCH\`"
          } > /tmp/comment.md
          gh pr comment 13 --repo tjhuber2009-eng/TestRepo --body-file /tmp/comment.md
