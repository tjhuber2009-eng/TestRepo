name: Inspect TrendFusion Public Assets

on:
  push:
    branches: [dual-signal-audit-2026-09]
    paths:
      - inspect_trendfusion_assets.py
      - .github/workflows/inspect-trendfusion-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dual-signal-audit-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow
      - name: Ensure screenshot text extraction
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr >/dev/null
          fi
      - run: python inspect_trendfusion_assets.py
      - name: Publish compact inspection
        run: |
          git pull --rebase origin dual-signal-audit-2026-09 || true
          mkdir -p audit_results_trendfusion
          cp trendfusion_public_inspection.json audit_results_trendfusion/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit_results_trendfusion/trendfusion_public_inspection.json
          git diff --cached --quiet || git commit -m 'Publish TrendFusion public inspection'
          git push origin HEAD:dual-signal-audit-2026-09
