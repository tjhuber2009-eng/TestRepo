name: Market Predictor - QuantRocket Stage 2C

on:
  workflow_call: {}
  push:
    branches:
      - market-predictor-stage2c
    paths:
      - "market_predictor/**"
      - ".github/workflows/market-predictor-quantrocket-stage2c.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      QR_LICENSE: ${{ secrets.QUANTROCKET_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker preflight
        run: |
          docker version
          docker compose version

      - name: QuantRocket secret status
        run: |
          if [ -z "$QR_LICENSE" ]; then
            echo "QUANTROCKET_LICENSE_KEY is not configured."
            echo "Secret is required before the data audit can run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "QuantRocket license secret is configured."
          fi
