name: Continuous NVIDIA AUTORESEARCH

on:
  schedule:
    - cron: "17 * * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: continuous-nvidia-autoresearch
  cancel-in-progress: false

jobs:
  cycle:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.number == 13 &&
        github.event.comment.body == '/continuous-autoresearch-cycle' &&
        github.event.comment.user.login == 'tjhuber2009-eng'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Integrity checks
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          python -m compileall -q .
          if test -f test_autoresearch_integrity.py; then
            python -m unittest -v test_autoresearch_integrity.py
          fi

      - name: Restore persistent research state
        shell: bash
        working-directory: .
        run: |
          git fetch origin continuous-autoresearch-state:refs/remotes/origin/continuous-autoresearch-state || true
          if git rev-parse --verify refs/remotes/origin/continuous-autoresearch-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/continuous-autoresearch-state -- moondev_autoresearch_reconstruction/continuous_state || true
            echo "restored persistent state"
          else
            echo "no prior state branch; starting clean"
          fi

      - name: Pre-run OOS contamination guard
        run: python oos_guard.py

      - name: Advance exhaustive nested research
        run: >
          python continuous_runner.py
          --iters-per-visit 2
          --max-visits 12
          --max-seconds 2400
          --breadth-target 10
          --depth-target 30
          --elite-target 60
          --depth-fraction 0.25
          --elite-fraction 0.20
          --model nvidia/nemotron-3-super-120b-a12b

      - name: Post-run OOS contamination guard
        run: python oos_guard.py

      - name: Build cycle report
        shell: python
        run: |
          import json
          from pathlib import Path

          p=Path("continuous_state/progress.json")
          q=Path("continuous_state/leaderboard_latest.json")
          if not p.exists() or not q.exists():
              raise SystemExit("progress/leaderboard missing")

          progress=json.loads(p.read_text())
          board=json.loads(q.read_text())
          rows=board.get("rows",[])[:12]

          out=[
              "# Continuous AUTORESEARCH cycle",
              "",
              f"Protocol: **{progress.get('protocol')}**",
              f"Phase: **{progress.get('phase')}**",
              f"Runnable tracks: **{progress.get('runnable_track_count',0)}**",
              f"Valid NVIDIA candidates accumulated: **{progress.get('total_valid_candidates',0)}**",
              f"Terminal tracks: **{progress.get('terminal_track_count',0)}**",
              f"Hidden validation pass/fail: **{progress.get('validation_pass_count',0)}/{progress.get('validation_fail_count',0)}**",
              f"Insufficient-data tracks: **{progress.get('data_insufficient_count',0)}**",
              f"Seed-blocked tracks: **{progress.get('seed_blocked_count',0)}**",
              f"Model crashes: **{progress.get('total_crashes',0)}**; semantic duplicates: **{progress.get('total_duplicates',0)}**; parameter-only rejected: **{progress.get('total_parameter_only',0)}**; too-broad rewrites rejected: **{progress.get('total_too_broad',0)}**; sizing-control changes rejected: **{progress.get('total_risk_control_changes',0)}**",
              f"Search budgets: breadth **{progress.get('breadth_target')}**, depth **{progress.get('depth_target')}**, elite **{progress.get('elite_target')}** valid candidates.",
              f"Special-engine families still blocked: **{progress.get('blocked_family_count',0)}**; previously falsified/overfit families preserved as terminal evidence: **{progress.get('prior_terminal_family_count',0)}**",
              "",
              "| Rank | Family | Target | Profile | Dev K | Dev Ret | Dev Sharpe | Dev DD | Hidden pass | Hidden Ret | Hidden DD |",
              "|---:|---|---|---|---:|---:|---:|---:|---|---:|---:|",
          ]
          for i,r in enumerate(rows,1):
              hp=r.get("hidden_validation_pass")
              hptext="—" if hp is None else ("PASS" if hp else "FAIL")
              out.append(
                  f"| {i} | {r.get('family')} | {r.get('target')} | {r.get('profile')} | "
                  f"{r.get('development_score')} | {r.get('development_return_pct')}% | "
                  f"{r.get('development_sharpe')} | {r.get('development_max_dd_pct')}% | "
                  f"{hptext} | {r.get('hidden_return_pct')} | {r.get('hidden_max_dd_pct')} |"
              )
          out += [
              "",
              "Adaptive NVIDIA search sees development data only. Hidden 2021–2022 (or target-specific pre-2023) validation is not opened until all adaptive search is frozen.",
              "Every candidate is cost-stressed and evaluated on continuous equity-path chronological folds; fold boundaries do not reset strategy state.",
              "2023+ final OOS remains absent from the research dataset.",
          ]
          Path("cycle-report.md").write_text("\n".join(out)+"\n")
          print("\n".join(out))

      - name: Prepare one-time completion notification
        id: completion
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          p=Path("continuous_state/progress.json")
          x=json.loads(p.read_text())
          marker=Path("continuous_state/ALL_RUNNABLE_TRACKS_TERMINAL")
          is_new=bool(x.get("all_runnable_tracks_terminal")) and not marker.exists()
          if is_new:
              marker.write_text(x.get("updated_at","")+"\n")
              Path("completion-note.md").write_text(
                  "# Continuous AUTORESEARCH exhaustive pass complete\n\n"
                  f"Terminal tracks: **{x['terminal_track_count']}/{x['runnable_track_count']}**.\n\n"
                  f"Hidden validation passes: **{x['validation_pass_count']}**; failures: **{x['validation_fail_count']}**.\n\n"
                  f"Data-insufficient: **{x['data_insufficient_count']}**; seed-blocked: **{x['seed_blocked_count']}**.\n\n"
                  f"Total valid NVIDIA candidates evaluated: **{x['total_valid_candidates']}**.\n\n"
                  f"Special-engine families still not runnable in this engine: **{x['blocked_family_count']}**.\n\n"
                  f"Previously falsified/overfit families preserved as terminal evidence: **{x.get('prior_terminal_family_count',0)}**.\n\n"
                  "2023+ final OOS remained sealed.\n"
              )
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"new_completion={'true' if is_new else 'false'}\n")
              f.write(
                  f"terminal={'true' if bool(x.get('all_runnable_tracks_terminal')) else 'false'}\n"
              )

      - name: Persist research state branch
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C continuous-autoresearch-state
          git add -f moondev_autoresearch_reconstruction/continuous_state
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "Continuous autoresearch state run $GITHUB_RUN_ID"
          fi
          git push --force-with-lease origin continuous-autoresearch-state

      - name: Upload current research state summary
        uses: actions/upload-artifact@v4
        with:
          name: continuous-autoresearch-${{ github.run_id }}
          path: |
            moondev_autoresearch_reconstruction/continuous_state/leaderboard_latest.json
            moondev_autoresearch_reconstruction/continuous_state/progress.json
            moondev_autoresearch_reconstruction/continuous_state/search_selections.json
            moondev_autoresearch_reconstruction/continuous_state/cycles.jsonl
            moondev_autoresearch_reconstruction/cycle-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Comment manual cycle result
        if: github.event_name == 'issue_comment'
        shell: bash
        working-directory: .
        run: >
          gh pr comment 13
          --repo tjhuber2009-eng/TestRepo
          --body-file moondev_autoresearch_reconstruction/cycle-report.md

      - name: Comment final exhaustive completion
        if: steps.completion.outputs.new_completion == 'true'
        shell: bash
        working-directory: .
        run: >
          gh pr comment 13
          --repo tjhuber2009-eng/TestRepo
          --body-file moondev_autoresearch_reconstruction/completion-note.md

      - name: Chain next cycle until exhaustive completion
        if: success() && steps.completion.outputs.terminal != 'true'
        shell: bash
        working-directory: .
        run: |
          echo "Dispatching next AUTORESEARCH cycle because runnable universe is not terminal."
          gh workflow run continuous-autoresearch.yml             --repo tjhuber2009-eng/TestRepo             --ref main
