name: NVIDIA AUTORESEARCH command

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  smoke:
    if: >
      github.event.issue.pull_request &&
      github.event.issue.number == 13 &&
      github.event.comment.body == '/nvidia-smoke' &&
      github.event.comment.user.login == 'tjhuber2009-eng'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: nvidia/nemotron-3-super-120b-a12b
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research branch
        uses: actions/checkout@v7
        with:
          ref: moondev-nvidia-autoresearch

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall -q .

      - name: Verify NVIDIA secret is available
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::NVIDIA_API_KEY repository secret is not available."
            exit 1
          fi
          echo "NVIDIA_API_KEY is present (value not displayed)."

      - name: NVIDIA NIM smoke test
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python nvidia_smoke.py 2>&1 | tee smoke.log

      - name: Comment smoke-test result on PR
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            {
              echo "NVIDIA smoke test: **PASS**"
              echo
              echo "Last output lines:"
              tail -n 8 smoke.log
            } > smoke-comment.md
          else
            {
              echo "NVIDIA smoke test: **FAIL**"
              echo
              echo "Last output lines:"
              tail -n 20 smoke.log 2>/dev/null || true
            } > smoke-comment.md
          fi
          gh pr comment 13 --repo tjhuber2009-eng/TestRepo --body-file smoke-comment.md

      - name: Fail job if smoke test failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
