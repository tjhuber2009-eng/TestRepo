name: Continuous AUTORESEARCH admission canary

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest -v test_autoresearch_integrity.py

      - name: Prepare AAPL development-only data
        run: >
          python prepare_market_data.py
          --source yahoo --symbol AAPL --id aapl
          --start 2010-01-01 --end 2020-12-31

      - name: Run two NVIDIA admission attempts
        shell: bash
        env:
          AUTORESEARCH_HARNESS: robust_harness.py
          AUTORESEARCH_PROGRAM: program_robust.md
          AUTORESEARCH_FAMILY: connors_double7
          AUTORESEARCH_SYMBOL: AAPL
          AUTORESEARCH_MARKET: stock
          AUTORESEARCH_DATA_FILE: data/aapl_1d.csv
          AUTORESEARCH_COMMISSION: "0.0002"
          AUTORESEARCH_MARGIN: "0.5"
          AUTORESEARCH_BARS_PER_YEAR: "252"
          AUTORESEARCH_PROFILE: prop
          AUTORESEARCH_MAX_DD_PCT: "10"
          AUTORESEARCH_MIN_TRADES: "8"
          AUTORESEARCH_MIN_VALIDATION_TRADES: "2"
          AUTORESEARCH_MIN_ACTIVE_FOLDS: "3"
          AUTORESEARCH_MIN_FOLD_BARS: "100"
          AUTORESEARCH_VOL_BAND: "0.50"
          AUTORESEARCH_COST_STRESS_MULT: "2.0"
          AUTORESEARCH_EXTREME_COST_STRESS_MULT: "3.0"
          AUTORESEARCH_BOOTSTRAP_REPS: "200"
          AUTORESEARCH_IS_START: "2010-01-01"
          AUTORESEARCH_VALIDATION_START: "2021-01-01"
          AUTORESEARCH_VALIDATION_END: "2022-12-31"
        run: |
          rm -rf keepers logs
          mkdir -p keepers logs
          rm -f baseline.json last_run.json validation_run.json results.tsv proposal.txt STOP strategy_best.py seen_hashes.json experiments.jsonl
          python seed_factory.py --family connors_double7 --output strategy.py --bars-per-year 252 --vol-target 0.04 --f-max 0.5
          python robust_harness.py --is
          cp strategy.py strategy_best.py
          cp last_run.json baseline.json
          cp strategy.py keepers/000_seed.py
          python loop.py --iters 2 --model nvidia/nemotron-3-super-120b-a12b
          python - <<'PY'
          import json
          from pathlib import Path

          rows=Path("results.tsv").read_text().splitlines()[1:]
          verdicts=[r.split("\t")[2] for r in rows if len(r.split("\t"))>2]
          valid=sum(v in {"KEPT","REJECTED"} for v in verdicts)
          rejected_pre=sum(v in {"CRASH","DUPLICATE","PARAMETER_ONLY","TOO_BROAD","RISK_CONTROL_CHANGE"} for v in verdicts)
          report={
              "verdicts":verdicts,
              "valid_candidates":valid,
              "pre_backtest_rejections":rejected_pre,
              "admission_fixed":valid >= 1,
          }
          Path("canary-result.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          if valid < 1:
              raise SystemExit("canary failed: zero candidates reached the backtest")
          PY

      - name: Comment result
        if: always()
        shell: bash
        run: |
          if test -f canary-result.json; then
            {
              echo "Admission canary result:"
              echo
              echo '\`\`\`json'
              cat canary-result.json
              echo '\`\`\`'
            } > canary-comment.md
          else
            echo "Admission canary failed before producing canary-result.json." > canary-comment.md
          fi
          gh pr comment 13 --repo tjhuber2009-eng/TestRepo --body-file canary-comment.md
