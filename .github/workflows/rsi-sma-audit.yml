name: RSI SMA Giant Return Audit

on:
  push:
    branches: [dual-signal-audit-2026-09]
    paths:
      - rsi_sma_audit.py
      - .github/workflows/rsi-sma-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests yfinance
      - name: Run RSI SMA audit
        run: python rsi_sma_audit.py
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-sma-audit-results
          path: audit_output_rsi/
          if-no-files-found: warn
