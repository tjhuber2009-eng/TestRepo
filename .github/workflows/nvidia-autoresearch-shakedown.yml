name: NVIDIA AUTORESEARCH 3-iteration shakedown

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  shakedown:
    if: >
      github.event.issue.pull_request &&
      github.event.issue.number == 13 &&
      github.event.comment.body == '/nvidia-shakedown' &&
      github.event.comment.user.login == 'tjhuber2009-eng'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: nvidia/nemotron-3-super-120b-a12b
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall -q .

      - name: Verify NVIDIA secret
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::NVIDIA_API_KEY repository secret is not available."
            exit 1
          fi
          echo "NVIDIA_API_KEY is present (value not displayed)."

      - name: Smoke test NVIDIA NIM
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python nvidia_smoke.py 2>&1 | tee smoke.log

      - name: Prepare ETH 6-hour data
        id: prepare
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python prepare_data.py --asset ETH --end 2022-12-31 2>&1 | tee prepare.log

      - name: Audit prepared data
        id: audit
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: python
        run: |
          import pandas as pd
          from pathlib import Path
          p = Path("data/ETH_6h.csv")
          df = pd.read_csv(p)
          t = pd.to_datetime(df["Date"], utc=True)
          dup = int(t.duplicated().sum())
          ordered = bool(t.is_monotonic_increasing)
          gaps = t.diff().dropna()
          unexpected = int((gaps != pd.Timedelta(hours=6)).sum())
          text = (
              f"rows={len(df)}\n"
              f"first={t.iloc[0]}\n"
              f"last={t.iloc[-1]}\n"
              f"duplicates={dup}\n"
              f"ordered={ordered}\n"
              f"non_6h_intervals={unexpected}\n"
          )
          print(text, end="")
          Path("data_audit.log").write_text(text, encoding="utf-8")
          if dup or not ordered:
              raise SystemExit("data integrity check failed")

      - name: Freeze in-sample baseline
        id: baseline
        if: steps.audit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python harness.py --is --set-baseline 2>&1 | tee baseline.log

      - name: Preserve seed as current champion
        id: seed
        if: steps.baseline.outcome == 'success'
        shell: bash
        run: |
          cp strategy.py strategy_best.py
          mkdir -p keepers logs
          cp strategy.py keepers/000_seed.py

      - name: Run exactly 3 NVIDIA AUTORESEARCH iterations
        id: research
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python loop.py --iters 3 --model "$NVIDIA_MODEL" 2>&1 | tee research.log

      - name: Audit three experiment outcomes
        id: resultaudit
        if: steps.research.outcome == 'success'
        continue-on-error: true
        shell: python
        run: |
          import csv
          from pathlib import Path
          p = Path("results.tsv")
          if not p.exists():
              raise SystemExit("results.tsv missing")
          rows = list(csv.DictReader(p.open(encoding="utf-8"), delimiter="\t"))
          print(f"rows={len(rows)}")
          for row in rows:
              print(f"iter={row.get('iter')} verdict={row.get('verdict')} score={row.get('score')} desc={row.get('desc')}")
          if len(rows) != 3:
              raise SystemExit(f"expected exactly 3 rows, found {len(rows)}")
          crashes = [r for r in rows if r.get("verdict") == "CRASH"]
          if crashes:
              raise SystemExit(f"{len(crashes)} of 3 iterations crashed")

      - name: Build shakedown report
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
          RESULT_AUDIT_OUTCOME: ${{ steps.resultaudit.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          from pathlib import Path
          import csv
          import os

          lines = [
              "# NVIDIA AUTORESEARCH 3-iteration shakedown",
              "",
              f"Run: {os.environ.get('RUN_URL', '')}",
              "",
              "## Stage outcomes",
              "",
              f"- NVIDIA smoke: {os.environ.get('SMOKE_OUTCOME', '')}",
              f"- data preparation: {os.environ.get('PREPARE_OUTCOME', '')}",
              f"- data audit: {os.environ.get('AUDIT_OUTCOME', '')}",
              f"- baseline: {os.environ.get('BASELINE_OUTCOME', '')}",
              f"- three-iteration research process: {os.environ.get('RESEARCH_OUTCOME', '')}",
              f"- three valid non-crash outcomes: {os.environ.get('RESULT_AUDIT_OUTCOME', '')}",
              "",
          ]

          for name in ["smoke.log", "prepare.log", "data_audit.log", "baseline.log", "research.log"]:
              p = Path(name)
              if p.exists():
                  tail = p.read_text(encoding="utf-8", errors="replace").splitlines()[-30:]
                  lines += [f"## {name} tail", "", "~~~text", *tail, "~~~", ""]

          for name in ["baseline.json", "last_run.json"]:
              p = Path(name)
              if p.exists():
                  lines += [f"## {name}", "", "~~~json", p.read_text(), "~~~", ""]

          p = Path("results.tsv")
          if p.exists():
              rows = list(csv.DictReader(p.open(encoding="utf-8"), delimiter="\t"))
              lines += ["## Results", ""]
              if rows:
                  cols = ["iter","verdict","base_score","score","ret_pct","sharpe","ann_vol","trades","max_dd","guard","desc"]
                  lines.append("| " + " | ".join(cols) + " |")
                  lines.append("|" + "|".join(["---"] * len(cols)) + "|")
                  for row in rows:
                      vals = [str(row.get(c, "")).replace("|", "\\|") for c in cols]
                      lines.append("| " + " | ".join(vals) + " |")
              else:
                  lines.append("No scored rows.")
              lines.append("")

          keepers = sorted(Path("keepers").glob("*.py"))
          lines += ["## Keepers", ""]
          lines += [f"- {p.name}" for p in keepers] or ["- none"]
          lines.append("")

          logs = sorted(p for p in Path("logs").glob("*") if p.name != ".gitkeep")
          lines += ["## Loop logs", "", f"{len(logs)} log files produced.", ""]

          Path("SHAKEDOWN_REPORT.md").write_text("\n".join(lines), encoding="utf-8")

      - name: Upload shakedown artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvidia-autoresearch-shakedown-${{ github.run_id }}
          path: |
            moondev_autoresearch_reconstruction/SHAKEDOWN_REPORT.md
            moondev_autoresearch_reconstruction/*.log
            moondev_autoresearch_reconstruction/baseline.json
            moondev_autoresearch_reconstruction/last_run.json
            moondev_autoresearch_reconstruction/results.tsv
            moondev_autoresearch_reconstruction/strategy.py
            moondev_autoresearch_reconstruction/strategy_best.py
            moondev_autoresearch_reconstruction/proposal.txt
            moondev_autoresearch_reconstruction/keepers/
            moondev_autoresearch_reconstruction/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment result on PR
        if: always()
        shell: bash
        run: |
          if [ -f SHAKEDOWN_REPORT.md ]; then
            gh pr comment 13 --repo tjhuber2009-eng/TestRepo --body-file SHAKEDOWN_REPORT.md
          else
            gh pr comment 13 --repo tjhuber2009-eng/TestRepo --body "NVIDIA AUTORESEARCH shakedown failed before a report could be generated. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Fail job unless all stages succeeded
        if: always()
        shell: bash
        run: |
          test "${{ steps.smoke.outcome }}" = "success"
          test "${{ steps.prepare.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.baseline.outcome }}" = "success"
          test "${{ steps.research.outcome }}" = "success"
          test "${{ steps.resultaudit.outcome }}" = "success"
