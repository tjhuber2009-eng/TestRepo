name: CatalogMirror CI
on:
  push:
    paths: ["catalogmirror/**", ".github/workflows/catalogmirror-ci.yml"]
  pull_request:
    paths: ["catalogmirror/**", ".github/workflows/catalogmirror-ci.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalogmirror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: catalogmirror/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Prisma validate
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/catalogmirror
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/catalogmirror
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/catalogmirror
          SHOPIFY_API_KEY: test
          SHOPIFY_API_SECRET: test
          SHOPIFY_APP_URL: https://example.com
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/catalogmirror
          SHOPIFY_API_KEY: test
          SHOPIFY_API_SECRET: test
          SHOPIFY_APP_URL: https://example.com
