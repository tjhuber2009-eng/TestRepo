name: Continuous NVIDIA AUTORESEARCH

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: continuous-nvidia-autoresearch
  cancel-in-progress: false
  queue: max

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch
          fetch-depth: 0

      - name: Record checked-out research source SHA
        shell: bash
        run: echo "AUTORESEARCH_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore sealed development-only market-data cache
        uses: actions/cache@v4
        with:
          path: moondev_autoresearch_reconstruction/data
          key: autoresearch-development-v3-sealed-${{ hashFiles('moondev_autoresearch_reconstruction/continuous_config.json') }}


      - name: Integrity checks
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          python -m compileall -q .
          if test -f test_autoresearch_integrity.py; then
            python -m unittest -v test_autoresearch_integrity.py
          fi

      - name: Restore persistent research state
        shell: bash
        working-directory: .
        run: |
          git fetch origin continuous-autoresearch-state:refs/remotes/origin/continuous-autoresearch-state || true
          if git rev-parse --verify refs/remotes/origin/continuous-autoresearch-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/continuous-autoresearch-state -- moondev_autoresearch_reconstruction/continuous_state || true
            echo "restored persistent state"
          else
            echo "no prior state branch; starting clean"
          fi

      - name: Capture pre-cycle V4 promotion counters
        id: promotion_before
        shell: python
        run: |
          import json, os
          from pathlib import Path

          p=Path("continuous_state/progress.json")
          x=json.loads(p.read_text()) if p.exists() else {}
          kept=int(x.get("total_kept_candidates",0) or 0)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"kept={kept}\n")

      - name: Restore latest tournament snapshot
        shell: bash
        working-directory: .
        run: |
          git fetch origin model-tournament-state:refs/remotes/origin/model-tournament-state || true
          if git rev-parse --verify refs/remotes/origin/model-tournament-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/model-tournament-state -- moondev_autoresearch_reconstruction/tournament_state || true
            echo "restored tournament state"
          else
            echo "no tournament state branch yet"
          fi

      - name: Capture workflow runtime metadata
        shell: bash
        working-directory: moondev_autoresearch_reconstruction
        run: |
          mkdir -p dashboard_runtime
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-autoresearch.yml/runs?per_page=8" > dashboard_runtime/continuous_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/continuous_runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/model-tournament.yml/runs?per_page=8" > dashboard_runtime/tournament_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/tournament_runs.json
          tournament_run_id="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("dashboard_runtime/tournament_runs.json")
          try:
              rows=json.loads(p.read_text()).get("workflow_runs",[])
              print(rows[0]["id"] if rows else "")
          except Exception:
              print("")
          PY
          )"
          if test -n "$tournament_run_id"; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$tournament_run_id/jobs?per_page=100" > dashboard_runtime/tournament_jobs.json || echo '{"jobs":[]}' > dashboard_runtime/tournament_jobs.json
          else
            echo '{"jobs":[]}' > dashboard_runtime/tournament_jobs.json
          fi

      - name: Pre-run OOS contamination guard
        run: python oos_guard.py

      - name: Advance exhaustive nested research
        run: >
          python continuous_runner.py
          --iters-per-visit 4
          --max-visits 8
          --max-seconds 2550
          --breadth-target 10
          --depth-target 30
          --elite-target 60
          --depth-fraction 0.25
          --elite-fraction 0.20
          --model auto

      - name: Post-run OOS contamination guard
        run: python oos_guard.py

      - name: Build cycle report
        shell: python
        run: |
          import json, math
          from pathlib import Path

          p=Path("continuous_state/progress.json")
          q=Path("continuous_state/leaderboard_latest.json")
          if not p.exists() or not q.exists():
              raise SystemExit("progress/leaderboard missing")

          progress=json.loads(p.read_text())
          board=json.loads(q.read_text())
          rows=board.get("rows",[])[:12]

          def f(v,d=3):
              try:
                  x=float(v)
                  return f"{x:.{d}f}" if math.isfinite(x) else "—"
              except Exception:
                  return "—"
          def pct(v,d=1):
              try:
                  x=float(v)
                  return f"{x:.{d}f}%"
              except Exception:
                  return "—"

          out=[
              "# Continuous AUTORESEARCH cycle",
              "",
              f"Protocol: **{progress.get('protocol')}**",
              f"Phase: **{progress.get('phase')}**",
              f"Runnable tracks: **{progress.get('runnable_track_count',0)}**",
              f"Valid model candidates accumulated: **{progress.get('total_valid_candidates',0)}**",
              f"PBO-ready tracks: **{progress.get('pbo_ready_track_count',0)}/{progress.get('pbo_baselined_track_count',0)}** baselined tracks",
              f"Terminal tracks: **{progress.get('terminal_track_count',0)}**",
              f"Hidden validation pass/fail: **{progress.get('validation_pass_count',0)}/{progress.get('validation_fail_count',0)}**",
              f"Model crashes: **{progress.get('total_crashes',0)}**; duplicates: **{progress.get('total_duplicates',0)}**; parameter-only: **{progress.get('total_parameter_only',0)}**; too-broad: **{progress.get('total_too_broad',0)}**; sizing changes: **{progress.get('total_risk_control_changes',0)}**",
              f"Search budgets: breadth **{progress.get('breadth_target')}**, depth **{progress.get('depth_target')}**, elite **{progress.get('elite_target')}** valid candidates.",
              "",
              "| # | Family | Target | Profile | Robust K | CAGR | Excess vs B&H | Sharpe | DD | PSR | FDR q | PBO | Evidence | 3x cost ret |",
              "|---:|---|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---|---:|",
          ]
          for i,r in enumerate(rows,1):
              psr=r.get("development_psr_zero")
              qv=r.get("multiple_test_qvalue")
              pbo=r.get("pbo")
              out.append(
                  f"| {i} | {r.get('family')} | {r.get('target')} | {r.get('profile')} | "
                  f"{f(r.get('development_score'),6)} | {pct(r.get('development_cagr_pct'))} | "
                  f"{pct(r.get('excess_cagr_vs_buyhold_pct'))} | {f(r.get('development_sharpe'))} | "
                  f"{pct(r.get('development_max_dd_pct'),2)} | "
                  f"{pct(None if psr is None else 100*float(psr))} | "
                  f"{pct(None if qv is None else 100*float(qv))} | "
                  f"{pct(None if pbo is None else 100*float(pbo))} | "
                  f"{r.get('evidence_grade') or '—'} | {pct(r.get('extreme_stress_return_pct'))} |"
              )
          out += [
              "",
              "Selection uses duration-normalized robust K, 2x/3x transaction-cost stress, statistical diagnostics, and CSCV PBO when enough candidate history exists.",
              "Adaptive model search sees development data only. Hidden pre-OOS validation remains sealed until all adaptive search is frozen.",
              "2023+ final OOS remains absent from the research dataset.",
          ]
          Path("cycle-report.md").write_text("\n".join(out)+"\n")
          print("\n".join(out))

      - name: Detect V4 promotion opportunity
        id: v4_promotion
        shell: python
        env:
          KEPT_BEFORE: ${{ steps.promotion_before.outputs.kept }}
        run: |
          import json, os
          from pathlib import Path

          x=json.loads(Path("continuous_state/progress.json").read_text())
          before=int(os.environ.get("KEPT_BEFORE","0") or 0)
          after=int(x.get("total_kept_candidates",0) or 0)
          terminal=bool(x.get("all_runnable_tracks_terminal"))
          trigger=(after > before) or terminal
          reason=(
              f"new_keepers:{after-before}"
              if after > before
              else ("final_frozen_pass" if terminal else "none")
          )
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"trigger={'true' if trigger else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"kept_after={after}\n")

      - name: Build private project dashboard
        run: >
          python build_dashboard.py
          --state-dir continuous_state
          --tournament-state-dir tournament_state
          --runtime-dir dashboard_runtime
          --output-dir continuous_state/dashboard

      - name: Prepare one-time completion notification
        id: completion
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          p=Path("continuous_state/progress.json")
          x=json.loads(p.read_text())
          marker=Path("continuous_state/ALL_RUNNABLE_TRACKS_TERMINAL")
          is_new=bool(x.get("all_runnable_tracks_terminal")) and not marker.exists()
          if is_new:
              marker.write_text(x.get("updated_at","")+"\n")
              Path("completion-note.md").write_text(
                  "# Continuous AUTORESEARCH exhaustive pass complete\n\n"
                  f"Terminal tracks: **{x['terminal_track_count']}/{x['runnable_track_count']}**.\n\n"
                  f"Hidden validation passes: **{x['validation_pass_count']}**; failures: **{x['validation_fail_count']}**.\n\n"
                  f"Data-insufficient: **{x['data_insufficient_count']}**; seed-blocked: **{x['seed_blocked_count']}**.\n\n"
                  f"Total valid NVIDIA candidates evaluated: **{x['total_valid_candidates']}**.\n\n"
                  f"Special-engine families still not runnable in this engine: **{x['blocked_family_count']}**.\n\n"
                  f"Previously falsified/overfit families preserved as terminal evidence: **{x.get('prior_terminal_family_count',0)}**.\n\n"
                  "2023+ final OOS remained sealed.\n"
              )
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"new_completion={'true' if is_new else 'false'}\n")
              f.write(
                  f"terminal={'true' if bool(x.get('all_runnable_tracks_terminal')) else 'false'}\n"
              )

      - name: Persist research state branch
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C continuous-autoresearch-state
          git add -f moondev_autoresearch_reconstruction/continuous_state
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            git commit -m "Continuous autoresearch state run $GITHUB_RUN_ID"
          fi
          git push --force-with-lease origin continuous-autoresearch-state

      - name: V4 promotion dispatch paused for privacy
        if: success() && steps.v4_promotion.outputs.trigger == 'true'
        shell: bash
        working-directory: .
        run: |
          echo "V4 promotion opportunity detected but automatic dispatch is paused until repository privacy is confirmed."

      - name: Refresh stable live dashboard
        shell: bash
        working-directory: .
        run: |
          gh workflow run autoresearch-dashboard.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Upload current research state summary
        uses: actions/upload-artifact@v4
        with:
          name: continuous-autoresearch-${{ github.run_id }}
          path: |
            moondev_autoresearch_reconstruction/continuous_state/leaderboard_latest.json
            moondev_autoresearch_reconstruction/continuous_state/progress.json
            moondev_autoresearch_reconstruction/continuous_state/search_selections.json
            moondev_autoresearch_reconstruction/continuous_state/cycles.jsonl
            moondev_autoresearch_reconstruction/cycle-report.md
            moondev_autoresearch_reconstruction/continuous_state/dashboard/index.html
            moondev_autoresearch_reconstruction/continuous_state/dashboard/dashboard.html
            moondev_autoresearch_reconstruction/continuous_state/dashboard/styles.css
            moondev_autoresearch_reconstruction/continuous_state/dashboard/app.js
            moondev_autoresearch_reconstruction/continuous_state/dashboard/data.json
          if-no-files-found: warn
          retention-days: 14

      - name: Continuous chaining paused for privacy
        if: success() && steps.completion.outputs.terminal != 'true'
        shell: bash
        working-directory: .
        run: |
          echo "Automatic chaining is paused until repository privacy is confirmed."
