name: Indicator Sentinel10 RSI90 Bootstrap

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run holdout-selected 10-90 bootstrap
        run: python indicator_validation/run_sentinel10_rsi90_bootstrap.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_sentinel10_rsi90_bootstrap.py indicator_validation/output_sentinel10_rsi90_bootstrap/* > indicator_validation/SHA256SUMS_SENTINEL10_RSI90.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-sentinel10-rsi90-bootstrap
          path: |
            indicator_validation/output_sentinel10_rsi90_bootstrap/
            indicator_validation/SHA256SUMS_SENTINEL10_RSI90.txt
          if-no-files-found: error
          retention-days: 7
