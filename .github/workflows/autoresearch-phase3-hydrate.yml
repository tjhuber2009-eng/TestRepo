name: AUTORESEARCH Phase 3 source hydration

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: autoresearch-phase3-source-hydration
  cancel-in-progress: false

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: atlas_forge_autoresearch
    steps:
      - name: Check out research source
        uses: actions/checkout@v7
        with:
          ref: atlas-forge-autoresearch
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Restore hydration queue
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/phase3-engine-mapping-state:refs/remotes/origin/phase3-engine-mapping-state
          git checkout refs/remotes/origin/phase3-engine-mapping-state -- atlas_forge_autoresearch/phase3_state/hydration_queue.json

      - name: Restore prior hydration state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/phase3-hydration-state:refs/remotes/origin/phase3-hydration-state || true
          if git rev-parse --verify refs/remotes/origin/phase3-hydration-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/phase3-hydration-state -- atlas_forge_autoresearch/phase3_state/hydrated_sources.jsonl atlas_forge_autoresearch/phase3_state/hydration_progress.json atlas_forge_autoresearch/phase3_state/hydration_cursor.json 2>/dev/null || true
          fi

      - name: Hydrate public source evidence
        run: |
          python -m py_compile phase3_source_hydrate_runner.py
          python phase3_source_hydrate_runner.py --max-candidates 150

      - name: Verify sealed boundaries
        id: progress
        shell: python
        run: |
          import json, os
          from pathlib import Path
          x=json.loads(Path("phase3_state/hydration_progress.json").read_text())
          assert x["phase1_registry_mutated"] is False
          assert x["hidden_validation_opened"] is False
          assert x["final_oos_opened"] is False
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"complete={'true' if x.get('all_hydrated_or_attempted') else 'false'}\n")
              f.write(f"processed={int(x.get('processed_count',0))}\n")
              f.write(f"total={int(x.get('queue_count',0))}\n")

      - name: Persist hydration state
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C phase3-hydration-state
          git add -f atlas_forge_autoresearch/phase3_state/hydrated_sources.jsonl atlas_forge_autoresearch/phase3_state/hydration_progress.json atlas_forge_autoresearch/phase3_state/hydration_cursor.json
          if git diff --cached --quiet; then
            echo "no hydration state changes"
          else
            git commit -m "Phase 3 hydration state run $GITHUB_RUN_ID"
          fi
          git push --force-with-lease origin phase3-hydration-state

      - name: Upload hydration snapshot
        uses: actions/upload-artifact@v7
        with:
          name: autoresearch-phase3-hydration-${{ github.run_id }}
          path: |
            atlas_forge_autoresearch/phase3_state/hydration_progress.json
            atlas_forge_autoresearch/phase3_state/hydrated_sources.jsonl
          retention-days: 14

      - name: Chain hydration batch
        if: success() && steps.progress.outputs.complete != 'true'
        shell: bash
        working-directory: .
        run: |
          echo "Phase 3 hydration: ${{ steps.progress.outputs.processed }}/${{ steps.progress.outputs.total }}"
          gh workflow run autoresearch-phase3-hydrate.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Reconstruct with hydrated evidence
        if: success() && steps.progress.outputs.complete == 'true'
        shell: bash
        working-directory: .
        run: gh workflow run autoresearch-phase3-reconstruct.yml --repo "$GITHUB_REPOSITORY" --ref main
