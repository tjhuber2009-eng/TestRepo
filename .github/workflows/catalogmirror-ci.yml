name: CatalogMirror CI
on:
  push:
    paths: ["catalogmirror/**", ".github/workflows/catalogmirror-ci.yml"]
  pull_request:
    paths: ["catalogmirror/**", ".github/workflows/catalogmirror-ci.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalogmirror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate || true
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/catalogmirror
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/catalogmirror
          SHOPIFY_API_KEY: test
          SHOPIFY_API_SECRET: test
          SHOPIFY_APP_URL: https://example.com
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/catalogmirror
          SHOPIFY_API_KEY: test
          SHOPIFY_API_SECRET: test
          SHOPIFY_APP_URL: https://example.com
      - name: Commit dependency lockfile
        if: github.event_name == 'push' && github.ref_name == 'catalogmirror-dependency-fix'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock CatalogMirror dependency fixes"
            git push
          fi
