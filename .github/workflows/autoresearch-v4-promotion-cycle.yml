name: Atlas Forge V4 promotion cycle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/atlas-forge-v4-kick"

permissions:
  actions: write
  contents: write

concurrency:
  group: autoresearch-v4-promotion-cycle
  cancel-in-progress: false

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v7
      - id: source
        name: Resolve immutable V4 source from kick
        shell: bash
        run: |
          source_ref="$(sed -n 's/^V4 source head: \([0-9a-fA-F]\{40\}\)$/\1/p' .github/atlas-forge-v4-kick | head -1)"
          if [[ ! "$source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Kick file must contain exactly one 40-hex 'V4 source head:' value"
            exit 1
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Pinned promotion source: $source_ref"

  private-development:
    needs: resolve-source
    uses: ./.github/workflows/autoresearch-v4-bootstrap.yml
    with:
      source_ref: ${{ needs.resolve-source.outputs.source_ref }}
    secrets: inherit

  prop-development:
    needs: [resolve-source, private-development]
    uses: ./.github/workflows/autoresearch-v4-prop-intraday.yml
    with:
      source_ref: ${{ needs.resolve-source.outputs.source_ref }}
    secrets: inherit

  verify-paired-provenance:
    needs: [resolve-source, private-development, prop-development]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout persisted V4 state
        uses: actions/checkout@v7
        with:
          ref: autoresearch-v4-state
          fetch-depth: 1

      - name: Require one source across private and prop state
        shell: python
        env:
          EXPECTED_SOURCE: ${{ needs.resolve-source.outputs.source_ref }}
        run: |
          import json, os
          from pathlib import Path

          root=Path("atlas_forge_autoresearch/v4_state")
          expected=os.environ["EXPECTED_SOURCE"]
          private=json.loads((root/"development-bootstrap.json").read_text())
          prop=json.loads((root/"prop-intraday-bootstrap.json").read_text())
          for name,row in (("private",private),("prop",prop)):
              actual=row.get("research_commit_sha")
              assert actual == expected, (
                  f"{name} source mismatch: expected {expected}, got {actual}"
              )
              assert row.get("stage") == "development_only", (
                  f"{name} stage not development_only"
              )
              assert row.get("hidden_validation_opened") is False, (
                  f"{name} opened hidden validation"
              )
              assert row.get("final_oos_opened") is False, (
                  f"{name} opened final OOS"
              )
          print({
              "paired_source": expected,
              "private_source": private["research_commit_sha"],
              "prop_source": prop["research_commit_sha"],
              "hidden_validation_opened": False,
              "final_oos_opened": False,
          })

  dashboard-refresh:
    needs: [resolve-source, verify-paired-provenance]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refresh dashboard with completed V4 state
        run: gh workflow run autoresearch-dashboard.yml --repo "$GITHUB_REPOSITORY" --ref main
