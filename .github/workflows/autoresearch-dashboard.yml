name: AUTORESEARCH dashboard snapshot

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch
          fetch-depth: 0

      - name: Restore current research state
        shell: bash
        run: |
          git fetch origin continuous-autoresearch-state:refs/remotes/origin/continuous-autoresearch-state
          git checkout refs/remotes/origin/continuous-autoresearch-state -- moondev_autoresearch_reconstruction/continuous_state

      - name: Restore current V4 development state
        shell: bash
        run: |
          git fetch origin autoresearch-v4-state:refs/remotes/origin/autoresearch-v4-state || true
          if git rev-parse --verify refs/remotes/origin/autoresearch-v4-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/autoresearch-v4-state -- moondev_autoresearch_reconstruction/v4_state || true
          fi

      - name: Restore tournament state if available
        shell: bash
        run: |
          git fetch origin model-tournament-state:refs/remotes/origin/model-tournament-state || true
          if git rev-parse --verify refs/remotes/origin/model-tournament-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/model-tournament-state -- moondev_autoresearch_reconstruction/tournament_state || true
          fi

      - name: Capture workflow runtime metadata
        shell: bash
        working-directory: moondev_autoresearch_reconstruction
        run: |
          mkdir -p dashboard_runtime
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-autoresearch.yml/runs?per_page=8" > dashboard_runtime/continuous_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/continuous_runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/autoresearch-v4-promotion-cycle.yml/runs?per_page=8" > dashboard_runtime/v4_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/v4_runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/model-tournament.yml/runs?per_page=8" > dashboard_runtime/tournament_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/tournament_runs.json
          tournament_run_id="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              rows=json.loads(Path("dashboard_runtime/tournament_runs.json").read_text()).get("workflow_runs",[])
              print(rows[0]["id"] if rows else "")
          except Exception:
              print("")
          PY
          )"
          if test -n "$tournament_run_id"; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$tournament_run_id/jobs?per_page=100" > dashboard_runtime/tournament_jobs.json || echo '{"jobs":[]}' > dashboard_runtime/tournament_jobs.json
          else
            echo '{"jobs":[]}' > dashboard_runtime/tournament_jobs.json
          fi

      - name: Validate dashboard JavaScript
        working-directory: moondev_autoresearch_reconstruction
        run: node --check dashboard_src/app.js

      - name: Build dashboard
        working-directory: moondev_autoresearch_reconstruction
        run: |
          python -m py_compile build_dashboard.py build_live_dashboard.py
          node --check dashboard_src/app.js
          python build_dashboard.py --state-dir continuous_state --tournament-state-dir tournament_state --runtime-dir dashboard_runtime --output-dir dashboard_output
          python build_live_dashboard.py
          test -s live-dashboard.md
          test -s dashboard_output/index.html
          test -s dashboard_output/dashboard.html
          test -s dashboard_output/data.json
          test -s dashboard_output/app.js
          test -s dashboard_output/styles.css

      - name: Keep dashboard local to workflow
        shell: bash
        working-directory: moondev_autoresearch_reconstruction
        run: |
          echo "Public dashboard publishing disabled."
          echo "dashboard_output retained only inside this ephemeral job workspace."

