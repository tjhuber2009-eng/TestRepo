[package]
name = "youtube-intelligence-desktop-native-check"
version = "3.1.0"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "=2.6.3" }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-shell = "=2.3.5"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
keyring = "=4.2.0"
