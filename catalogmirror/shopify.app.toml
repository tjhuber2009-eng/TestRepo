# Link this repository to the existing CatalogMirror app with `shopify app config link`
# before the first production release. Do not change distribution mode.
client_id = ""
name = "CatalogMirror"
handle = "catalogmirror"
application_url = "https://web-production-0f33a.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_products,read_inventory"

[auth]
redirect_urls = [
  "https://web-production-0f33a.up.railway.app/auth/callback",
  "https://web-production-0f33a.up.railway.app/auth/shopify/callback",
  "https://web-production-0f33a.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
topics = ["products/create"]
uri = "/webhooks/products/create"

[[webhooks.subscriptions]]
topics = ["products/update"]
uri = "/webhooks/products/update"

[[webhooks.subscriptions]]
topics = ["products/delete"]
uri = "/webhooks/products/delete"

[[webhooks.subscriptions]]
topics = ["inventory_levels/update"]
uri = "/webhooks/inventory_levels/update"

[[webhooks.subscriptions]]
topics = ["bulk_operations/finish"]
uri = "/webhooks/bulk_operations/finish"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/shop/redact"
