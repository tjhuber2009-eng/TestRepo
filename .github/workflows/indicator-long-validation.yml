name: Indicator Cross Strategy DD Frontier

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run cross-strategy DD frontier
        run: python indicator_validation/run_cross_strategy_frontier.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_cross_strategy_frontier.py indicator_validation/output_cross_strategy_frontier/* > indicator_validation/SHA256SUMS_CROSS_STRATEGY.txt
      - name: Upload cross-strategy artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-cross-strategy-frontier
          path: |
            indicator_validation/output_cross_strategy_frontier/
            indicator_validation/SHA256SUMS_CROSS_STRATEGY.txt
          if-no-files-found: error
          retention-days: 7
