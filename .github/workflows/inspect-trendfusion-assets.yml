name: Inspect TrendFusion Public Assets

on:
  push:
    branches: [dual-signal-audit-2026-09]
    paths:
      - inspect_trendfusion_assets.py
      - .github/workflows/inspect-trendfusion-assets.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python inspect_trendfusion_assets.py
