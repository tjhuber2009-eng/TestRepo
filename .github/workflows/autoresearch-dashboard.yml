name: AUTORESEARCH dashboard snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/autoresearch-dashboard.yml"
  workflow_run:
    workflows:
      - Continuous NVIDIA AUTORESEARCH
      - Stock + FX AUTORESEARCH
      - AUTORESEARCH v4 promotion cycle
      - Zero-fee AI strategy model tournament
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: autoresearch-dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: moondev-nvidia-autoresearch
          fetch-depth: 0

      - name: Restore current research state
        shell: bash
        run: |
          git fetch origin +refs/heads/continuous-autoresearch-state:refs/remotes/origin/continuous-autoresearch-state
          git checkout refs/remotes/origin/continuous-autoresearch-state -- moondev_autoresearch_reconstruction/continuous_state

      - name: Restore current stock/FX expansion state
        shell: bash
        run: |
          git fetch origin +refs/heads/stock-fx-autoresearch-state:refs/remotes/origin/stock-fx-autoresearch-state || true
          if git rev-parse --verify refs/remotes/origin/stock-fx-autoresearch-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/stock-fx-autoresearch-state -- moondev_autoresearch_reconstruction/stock_fx_state || true
          fi

      - name: Restore current V4 development state
        shell: bash
        run: |
          git fetch origin +refs/heads/autoresearch-v4-state:refs/remotes/origin/autoresearch-v4-state || true
          if git rev-parse --verify refs/remotes/origin/autoresearch-v4-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/autoresearch-v4-state -- moondev_autoresearch_reconstruction/v4_state || true
          fi

      - name: Restore tournament state if available
        shell: bash
        run: |
          git fetch origin +refs/heads/model-tournament-state:refs/remotes/origin/model-tournament-state || true
          if git rev-parse --verify refs/remotes/origin/model-tournament-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/model-tournament-state -- moondev_autoresearch_reconstruction/tournament_state || true
          fi

      - name: Capture workflow runtime metadata
        shell: bash
        working-directory: moondev_autoresearch_reconstruction
        run: |
          mkdir -p dashboard_runtime
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/continuous-autoresearch.yml/runs?per_page=8" > dashboard_runtime/continuous_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/continuous_runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/stock-fx-autoresearch.yml/runs?per_page=8" > dashboard_runtime/stock_fx_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/stock_fx_runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/autoresearch-v4-promotion-cycle.yml/runs?per_page=8" > dashboard_runtime/v4_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/v4_runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/model-tournament.yml/runs?per_page=8" > dashboard_runtime/tournament_runs.json || echo '{"workflow_runs":[]}' > dashboard_runtime/tournament_runs.json
          tournament_run_id="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              rows=json.loads(Path("dashboard_runtime/tournament_runs.json").read_text()).get("workflow_runs",[])
              print(rows[0]["id"] if rows else "")
          except Exception:
              print("")
          PY
          )"
          if test -n "$tournament_run_id"; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$tournament_run_id/jobs?per_page=100" > dashboard_runtime/tournament_jobs.json || echo '{"jobs":[]}' > dashboard_runtime/tournament_jobs.json
          else
            echo '{"jobs":[]}' > dashboard_runtime/tournament_jobs.json
          fi

      - name: Validate dashboard JavaScript
        working-directory: moondev_autoresearch_reconstruction
        run: node --check dashboard_src/app.js

      - name: Build dashboard
        working-directory: moondev_autoresearch_reconstruction
        run: |
          python -m py_compile build_dashboard.py build_live_dashboard.py
          node --check dashboard_src/app.js
          python build_dashboard.py --state-dir continuous_state --stock-fx-state-dir stock_fx_state --tournament-state-dir tournament_state --runtime-dir dashboard_runtime --output-dir dashboard_output
          python build_live_dashboard.py
          test -s live-dashboard.md
          test -s dashboard_output/index.html
          test -s dashboard_output/dashboard.html
          test -s dashboard_output/data.json
          test -s dashboard_output/app.js
          test -s dashboard_output/styles.css

      - name: Publish standalone-dashboard data feed
        shell: bash
        run: |
          git fetch origin +refs/heads/autoresearch-dashboard-state:refs/remotes/origin/autoresearch-dashboard-state
          rm -rf ../autoresearch-dashboard-state-wt
          git worktree add -B autoresearch-dashboard-state ../autoresearch-dashboard-state-wt refs/remotes/origin/autoresearch-dashboard-state
          mkdir -p ../autoresearch-dashboard-state-wt/live
          cp moondev_autoresearch_reconstruction/dashboard_output/data.json ../autoresearch-dashboard-state-wt/live/data.json
          cd ../autoresearch-dashboard-state-wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f live/data.json
          if git diff --cached --quiet; then
            echo "dashboard data unchanged"
          else
            git commit -m "Dashboard live data run $GITHUB_RUN_ID"
            git push origin HEAD:autoresearch-dashboard-state
          fi

      - name: Update stable live dashboard issue
        shell: bash
        working-directory: moondev_autoresearch_reconstruction
        run: |
          gh issue edit 20 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file live-dashboard.md

      - name: Upload private dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: autoresearch-dashboard-${{ github.run_id }}
          path: moondev_autoresearch_reconstruction/dashboard_output
          retention-days: 30

