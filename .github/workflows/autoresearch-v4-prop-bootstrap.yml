name: AUTORESEARCH v4 prop-firm bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autoresearch-v4-prop-bootstrap
  cancel-in-progress: false

jobs:
  prop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: atlas_forge_autoresearch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: autoresearch-v4-alpha-generation
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas_forge_autoresearch/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and run v4 integrity suite
        run: |
          python -m compileall -q v4 test_v4_alpha_generation.py
          python -m unittest -v test_v4_alpha_generation.py

      - name: Prepare BTC development proxy
        run: python prepare_market_data.py --source binance --symbol BTCUSDT --id btc --start 2017-08-17 --end 2020-12-31 --output-dir v4_prop_data

      - name: Prepare ETH development proxy
        run: python prepare_market_data.py --source binance --symbol ETHUSDT --id eth --start 2017-08-17 --end 2020-12-31 --output-dir v4_prop_data

      - name: Run separate prop optimization
        run: python -m v4.prop_live_bootstrap --data-dir v4_prop_data --output v4_state/prop-bootstrap.json

      - name: Enforce sealed boundary and deployment labels
        shell: python
        run: |
          import json
          from pathlib import Path
          x=json.loads(Path("v4_state/prop-bootstrap.json").read_text())
          assert x["track"]=="prop_firm"
          assert x["stage"]=="development_only"
          assert x["data_end"] <= "2020-12-31"
          assert x["hidden_validation_opened"] is False
          assert x["final_oos_opened"] is False
          assert x["private_track_independent"] is True
          assert all(
              not row["venue_execution_verified"]
              for row in x["market_mapping"].values()
          )

      - name: Persist prop development state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/autoresearch-v4-state:refs/remotes/origin/autoresearch-v4-state
          rm -rf ../v4-prop-state-wt
          git worktree add -B autoresearch-v4-state ../v4-prop-state-wt refs/remotes/origin/autoresearch-v4-state
          mkdir -p ../v4-prop-state-wt/atlas_forge_autoresearch/v4_state
          cp atlas_forge_autoresearch/v4_state/prop-bootstrap.json ../v4-prop-state-wt/atlas_forge_autoresearch/v4_state/prop-bootstrap.json
          cd ../v4-prop-state-wt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f atlas_forge_autoresearch/v4_state/prop-bootstrap.json
          if ! git diff --cached --quiet; then
            git commit -m "V4 prop bootstrap run $GITHUB_RUN_ID"
            git push origin HEAD:autoresearch-v4-state
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: autoresearch-v4-prop-${{ github.run_id }}
          path: atlas_forge_autoresearch/v4_state/prop-bootstrap.json
          retention-days: 30
