name: Indicator Sentinel DD3 Validation

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run Sentinel63 DD3 frontier
        run: python indicator_validation/run_sentinel_dd3.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_sentinel_dd3.py indicator_validation/output_sentinel_dd3/* > indicator_validation/SHA256SUMS_DD3.txt
      - name: Upload DD3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-sentinel-dd3-validation
          path: |
            indicator_validation/output_sentinel_dd3/
            indicator_validation/SHA256SUMS_DD3.txt
          if-no-files-found: error
          retention-days: 7
