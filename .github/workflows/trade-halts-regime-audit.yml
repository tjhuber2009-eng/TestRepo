name: Trade Halts Recent Regime Audit

on:
  workflow_dispatch:
  push:
    branches: [dual-signal-audit-2026-09]
    paths:
      - .github/workflows/trade-halts-regime-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dual-signal-audit-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone frozen upstream
        run: |
          git clone https://github.com/gilbertknight-star/Trade-Halts.git /tmp/halts
          cd /tmp/halts
          git checkout ec68b9581a32c51dce9fb5b65adc97b22861255f
      - name: Install deps
        run: python -m pip install pandas pyarrow numpy
      - name: Reset-capital regime tests
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np, pandas as pd

          root=Path('/tmp/halts/research/data')
          tr=pd.read_csv(root/'halt_trades_rvol.csv',parse_dates=['entry_ts','exit_ts'])
          ev=pd.read_parquet(root/'halt_events.parquet')
          ev['anchor_ts_utc']=pd.to_datetime(ev.anchor_ts_utc,utc=True)
          tr['entry_ts']=pd.to_datetime(tr.entry_ts,utc=True)
          tr['date_dt']=pd.to_datetime(tr.date)
          tr['date']=tr.date_dt.dt.date
          meta=ev[['symbol_resolved','anchor_ts_utc','exchange']].rename(columns={'symbol_resolved':'symbol','anchor_ts_utc':'entry_ts'})
          tr=tr.merge(meta,on=['symbol','entry_ts'],how='left',validate='many_to_one')

          def comm(shares,price): return max(1.0,min(shares*.005,shares*price*.01))
          def sim(start_date,end_date=None,nasdaq_only=False,start_equity=900.,entry_mult=1.0,exit_mult=1.0):
              d=tr[tr.date_dt>=pd.Timestamp(start_date)].copy()
              if end_date: d=d[d.date_dt<=pd.Timestamp(end_date)]
              if nasdaq_only: d=d[d.exchange.eq('Nasdaq')]
              d=d.sort_values(['date','entry_ts'])
              eq=start_equity; curve=[]; rets=[]; trades=0
              for date,g in d.groupby('date',sort=True):
                  bod=eq; avail=bod; pnl=0.
                  for _,t in g.iterrows():
                      pos=min(bod*.10,100000.,avail)
                      if pos<5: continue
                      ep=float(t.entry_px)*entry_mult; xp=float(t.exit_px)*exit_mult
                      shares=pos/ep
                      net=pos*(xp/ep-1)-comm(shares,ep)-comm(shares,xp)
                      pnl+=net; avail-=pos; trades+=1; rets.append((xp/ep-1)*100)
                  eq+=pnl; curve.append((pd.Timestamp(date),eq))
              if not curve: return {'trades':0}
              vals=np.array([e for _,e in curve]); rm=np.maximum.accumulate(vals); dd=(vals/rm-1).min()
              years=(curve[-1][0]-curve[0][0]).days/365.25
              # For sub-year windows, report annualized but also total return.
              cagr=(eq/start_equity)**(1/max(years,1/365.25))-1
              return {'start':str(curve[0][0].date()),'end':str(curve[-1][0].date()),'calendar_span_years':years,'trades':trades,'final':eq,'total_return_pct':(eq/start_equity-1)*100,'annualized_pct':cagr*100,'max_dd_pct':dd*100,'win_rate_pct':float((np.array(rets)>0).mean()*100),'median_trade_pct':float(np.median(rets))}

          windows={}
          for s in ['2021-04-21','2022-01-01','2023-01-01','2024-01-01','2025-01-01','2026-01-01']:
              windows[f'all_from_{s}']=sim(s)
              windows[f'nasdaq_from_{s}']=sim(s,nasdaq_only=True)
          for y in [2021,2022,2023,2024,2025,2026]:
              windows[f'all_{y}_reset']=sim(f'{y}-01-01',f'{y}-12-31')
              windows[f'nasdaq_{y}_reset']=sim(f'{y}-01-01',f'{y}-12-31',nasdaq_only=True)
          # suspicious split-adjusted price robustness
          for lim in [1000,100000]:
              old=tr
              filtered=tr[tr.entry_px<=lim].copy()
              tr_backup=tr
              tr=filtered
              windows[f'all_exclude_entry_gt_{lim}']=sim('2021-04-21')
              windows[f'nasdaq_exclude_entry_gt_{lim}']=sim('2021-04-21',nasdaq_only=True)
              tr=tr_backup

          out={'windows':windows,'note':'All windows reset to $900; 2026 ends at ledger end 2026-05-08. Nasdaq-only is closest historical proxy to live LUDP code.'}
          os.makedirs('/tmp/regime',exist_ok=True)
          Path('/tmp/regime/regime_reset.json').write_text(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trade-halts-regime-audit
          path: /tmp/regime/regime_reset.json
      - name: Publish result
        run: |
          git pull --rebase origin dual-signal-audit-2026-09 || true
          mkdir -p audit_results_trade_halts
          cp /tmp/regime/regime_reset.json audit_results_trade_halts/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit_results_trade_halts/regime_reset.json
          git diff --cached --quiet || git commit -m 'Publish Trade-Halts recent regime audit'
          git push origin HEAD:dual-signal-audit-2026-09
