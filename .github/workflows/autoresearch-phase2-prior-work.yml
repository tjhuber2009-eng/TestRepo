name: AUTORESEARCH Phase 2 prior-work lane

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: autoresearch-phase2-prior-work
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: atlas_forge_autoresearch
    steps:
      - name: Check out research source
        uses: actions/checkout@v7
        with:
          ref: atlas-forge-autoresearch
          fetch-depth: 0

      - name: Record source SHA
        shell: bash
        run: echo "AUTORESEARCH_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas_forge_autoresearch/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore development-only data cache
        uses: actions/cache@v6
        with:
          path: atlas_forge_autoresearch/data
          key: phase2-development-v3-sealed-${{ hashFiles('atlas_forge_autoresearch/continuous_config.json') }}

      - name: Restore isolated Phase 2 state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/phase2-autoresearch-state:refs/remotes/origin/phase2-autoresearch-state || true
          if git rev-parse --verify refs/remotes/origin/phase2-autoresearch-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/phase2-autoresearch-state -- atlas_forge_autoresearch/phase2_state || true
          fi

      - name: Integrity and contamination guards
        shell: bash
        run: |
          python -m compileall -q .
          python -m unittest -v test_autoresearch_integrity.py
          python oos_guard.py

      - name: Advance prior-work baseline screening
        run: python phase2_prior_runner.py --max-tracks 192

      - name: Advance survivor follow-up when baseline is complete
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          x=json.loads(Path("phase2_state/progress.json").read_text())
          if x.get("all_tracks_screened"):
              subprocess.run(
                  [sys.executable, "phase2_followup_runner.py", "--max-candidates", "48"],
                  check=True,
              )

      - name: Post-run contamination guard
        run: python oos_guard.py

      - name: Determine continuation
        id: progress
        shell: python
        run: |
          import json, os
          from pathlib import Path
          baseline=json.loads(Path("phase2_state/progress.json").read_text())
          baseline_complete=bool(baseline.get("all_tracks_screened"))
          follow_path=Path("phase2_state/followup_progress.json")
          follow=(json.loads(follow_path.read_text()) if follow_path.exists() else {})
          follow_complete=bool(follow.get("all_survivors_followed_up"))
          complete=baseline_complete and follow_complete
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"complete={'true' if complete else 'false'}\n")
              f.write(f"screened={int(baseline.get('screened_count',0))}\n")
              f.write(f"total={int(baseline.get('track_count',0))}\n")
              f.write(f"followed={int(follow.get('processed_count',0))}\n")
              f.write(f"survivors={int(follow.get('candidate_count',0))}\n")

      - name: Persist isolated Phase 2 state
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C phase2-autoresearch-state
          git add -f atlas_forge_autoresearch/phase2_state
          if git diff --cached --quiet; then
            echo "no Phase 2 state changes"
          else
            git commit -m "Phase 2 prior-work state run $GITHUB_RUN_ID"
          fi
          git push --force-with-lease origin phase2-autoresearch-state

      - name: Upload Phase 2 snapshot
        uses: actions/upload-artifact@v7
        with:
          name: autoresearch-phase2-${{ github.run_id }}
          path: atlas_forge_autoresearch/phase2_state
          retention-days: 14

      - name: Chain next Phase 2 batch
        if: success() && steps.progress.outputs.complete != 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Phase 2 baseline: ${{ steps.progress.outputs.screened }}/${{ steps.progress.outputs.total }}; follow-up: ${{ steps.progress.outputs.followed }}/${{ steps.progress.outputs.survivors }}"
          gh workflow run autoresearch-phase2-prior-work.yml --repo "$GITHUB_REPOSITORY" --ref main
