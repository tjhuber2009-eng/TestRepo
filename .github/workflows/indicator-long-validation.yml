name: Indicator Long Validation

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow requests
      - name: Run frozen BoTo validation
        run: python indicator_validation/run_boto_long.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_boto_long.py indicator_validation/output/* > indicator_validation/output/SHA256SUMS.txt
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: boto-long-validation
          path: indicator_validation/output/
          if-no-files-found: error
          retention-days: 7
