name: Indicator Cash Enhanced Frontier

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run cash-enhanced frontier
        run: python indicator_validation/run_cash_enhanced.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_cash_enhanced.py indicator_validation/output_cash_enhanced/* > indicator_validation/SHA256SUMS_CASH_ENHANCED.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-cash-enhanced-frontier
          path: |
            indicator_validation/output_cash_enhanced/
            indicator_validation/SHA256SUMS_CASH_ENHANCED.txt
          if-no-files-found: error
          retention-days: 7
