name: YKE v3.1 Windows Native Probe

on:
  workflow_dispatch:
  push:
    branches: [yke-v3.1-windows-build]
    paths:
      - '.github/workflows/yke-windows-build.yml'
      - 'youtube-knowledge-engine/native-probe/**'

permissions:
  contents: read

jobs:
  windows-native-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'

      - name: Reconstruct and verify certified Windows icon
        shell: pwsh
        run: |
          $b64 = (Get-Content -Raw 'youtube-knowledge-engine/native-probe/icons/icon.ico.b64').Trim()
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes('youtube-knowledge-engine/native-probe/icons/icon.ico', $bytes)
          $icon = 'youtube-knowledge-engine/native-probe/icons/icon.ico'
          if ((Get-Item $icon).Length -ne 9576) { throw "Icon size mismatch: $((Get-Item $icon).Length)" }
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '27eabc7242f1cd18497b474003689d60959b0111dd87b6a34e51f3a7154efe27') {
            throw "Icon SHA-256 mismatch: $hash"
          }

      - name: Cargo check exact v3.1 native shell
        run: cargo check --manifest-path youtube-knowledge-engine/native-probe/Cargo.toml
