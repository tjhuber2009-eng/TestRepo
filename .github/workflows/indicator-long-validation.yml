name: Indicator Final Current63 Validation

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run exact current 63-day Sentinel validation
        run: python indicator_validation/run_sentinel_broad.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_sentinel_broad.py indicator_validation/output_sentinel_broad63/* > indicator_validation/SHA256SUMS_CURRENT63.txt
      - name: Upload final current63 artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-final-current63-validation
          path: |
            indicator_validation/output_sentinel_broad63/
            indicator_validation/SHA256SUMS_CURRENT63.txt
          if-no-files-found: error
          retention-days: 7
