name: AUTORESEARCH seed audit

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  seed-audit:
    if: >
      github.event.issue.pull_request &&
      github.event.issue.number == 13 &&
      github.event.comment.body == '/seed-audit' &&
      github.event.comment.user.login == 'tjhuber2009-eng'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research branch
        uses: actions/checkout@v7
        with:
          ref: moondev-nvidia-autoresearch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall -q .

      - name: Prepare verified IS data only
        run: python prepare_data.py --asset ETH --end 2022-12-31

      - name: Run seed baseline
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python harness.py --is --set-baseline 2>&1 | tee seed-baseline.log

      - name: Comment seed baseline on PR
        if: always()
        shell: python
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          import json
          import os
          from pathlib import Path
          p = Path("baseline.json")
          lines = ["## Volatility-targeted seed audit", "", f"Run: {os.environ['RUN_URL']}", ""]
          if p.exists():
              x = json.loads(p.read_text())
              lines += [
                  f"- K: **{x['score']}**",
                  f"- return: **{x['return_pct']}%**",
                  f"- signed Sharpe: **{x['sharpe']}**",
                  f"- annualized vol: **{x['ann_vol_pct']}%**",
                  f"- max DD: **{x['max_dd_pct']}%**",
                  f"- trades: **{x['trades']}**",
                  f"- win rate: **{x['win_pct']}%**",
                  f"- profit factor: **{x['pf']}**",
                  f"- guard: **{x['guard_ok']}** — {x['guard_reason']}",
              ]
          else:
              lines += ["Baseline failed.", "", "Last log lines:", ""]
              if Path("seed-baseline.log").exists():
                  lines += Path("seed-baseline.log").read_text(errors="replace").splitlines()[-30:]
          Path("seed-comment.md").write_text("\n".join(lines), encoding="utf-8")

      - name: Post seed audit
        if: always()
        shell: bash
        run: gh pr comment 13 --repo tjhuber2009-eng/TestRepo --body-file seed-comment.md

      - name: Fail if baseline failed
        if: steps.baseline.outcome != 'success'
        run: exit 1
