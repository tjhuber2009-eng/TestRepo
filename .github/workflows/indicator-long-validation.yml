name: Indicator Cash Robustness V2

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Run cash robustness v2
        run: python indicator_validation/run_cash_robustness_v2.py
      - name: Hash outputs
        run: sha256sum indicator_validation/run_cash_robustness_v2.py indicator_validation/output_cash_robustness_v2/* > indicator_validation/SHA256SUMS_CASH_ROBUSTNESS_V2.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-cash-robustness-v2
          path: |
            indicator_validation/output_cash_robustness_v2/
            indicator_validation/SHA256SUMS_CASH_ROBUSTNESS_V2.txt
          if-no-files-found: error
          retention-days: 7
