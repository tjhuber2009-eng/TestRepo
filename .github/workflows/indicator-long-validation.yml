name: Indicator Long Validation

on:
  push:
    branches:
      - indicator-long-validation-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow requests yfinance
      - name: Run frozen BoTo validation and acquire dataset
        run: python indicator_validation/run_boto_long.py
      - name: Run simple source-informed survivors
        run: python indicator_validation/run_simple_survivors.py
      - name: Run frozen Sentinel cross-asset robustness
        run: python indicator_validation/run_sentinel_crossasset.py
      - name: Export validated OHLC CSV
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=next(Path('indicator_validation/output').glob('btcusdt_30m_kline_*.parquet'))
          d=pd.read_parquet(p)
          d.columns=[str(c).lower() for c in d.columns]
          t=next(c for c in ['datetime','timestamp','open_time','ts'] if c in d.columns)
          s=d[t]
          if pd.api.types.is_numeric_dtype(s):
              x=pd.to_numeric(s); med=float(x.abs().median()); unit='ns' if med>1e17 else ('us' if med>1e14 else ('ms' if med>1e11 else 's'))
              dt=pd.to_datetime(x,unit=unit,utc=True)
          else:
              dt=pd.to_datetime(s,utc=True)
          out=pd.DataFrame({'datetime':dt})
          for c in ['open','high','low','close']:
              out[c]=pd.to_numeric(d[c],errors='coerce')
          out.dropna().sort_values('datetime').drop_duplicates('datetime').to_csv('indicator_validation/btcusdt_30m_20200101_20260902_ohlc.csv.gz',index=False,compression='gzip')
          PY
      - name: Hash outputs
        run: |
          sha256sum indicator_validation/run_boto_long.py indicator_validation/run_simple_survivors.py indicator_validation/run_sentinel_crossasset.py indicator_validation/output/* indicator_validation/output_survivors/* indicator_validation/output_sentinel/* indicator_validation/btcusdt_30m_20200101_20260902_ohlc.csv.gz > indicator_validation/SHA256SUMS_ALL.txt
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: indicator-long-validation
          path: |
            indicator_validation/output/
            indicator_validation/output_survivors/
            indicator_validation/output_sentinel/
            indicator_validation/btcusdt_30m_20200101_20260902_ohlc.csv.gz
            indicator_validation/SHA256SUMS_ALL.txt
          if-no-files-found: error
          retention-days: 7
