name: Stock + FX AUTORESEARCH

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: stock-fx-autoresearch
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research source
        uses: actions/checkout@v7
        with:
          ref: moondev-nvidia-autoresearch
          fetch-depth: 0

      - name: Record research source SHA
        shell: bash
        run: echo "AUTORESEARCH_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore development-only expansion data cache
        uses: actions/cache@v6
        with:
          path: moondev_autoresearch_reconstruction/data
          key: stock-fx-development-v1-${{ hashFiles('moondev_autoresearch_reconstruction/stock_fx_config.json') }}

      - name: Restore persistent stock/FX state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/stock-fx-autoresearch-state:refs/remotes/origin/stock-fx-autoresearch-state || true
          if git rev-parse --verify refs/remotes/origin/stock-fx-autoresearch-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/stock-fx-autoresearch-state -- moondev_autoresearch_reconstruction/stock_fx_state || true
            echo "restored stock/FX state"
          else
            echo "no prior stock/FX state; starting clean"
          fi

      - name: Restore latest model tournament state
        shell: bash
        working-directory: .
        run: |
          git fetch origin +refs/heads/model-tournament-state:refs/remotes/origin/model-tournament-state || true
          if git rev-parse --verify refs/remotes/origin/model-tournament-state >/dev/null 2>&1; then
            git checkout refs/remotes/origin/model-tournament-state -- moondev_autoresearch_reconstruction/tournament_state || true
          fi

      - name: Integrity and universe-lock checks
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          python -m compileall -q .
          python -m unittest -v test_autoresearch_integrity.py
          python - <<'PY'
          import continuous_runner as c
          c.configure_paths(
              "stock_fx_config.json",
              "stock_fx_state",
              "strategy_library/stock_fx_universe_plan.json",
          )
          tracks=c.build_tracks()
          counts={}
          for t in tracks:
              counts[t["target"]["market"]]=counts.get(t["target"]["market"],0)+1
          assert len(tracks)==1110, len(tracks)
          assert counts=={"stock":900,"forex":210}, counts
          assert not c.hidden_validation_allowed_by_universe_plan()
          print({"tracks":len(tracks),"by_market":counts,"hidden_validation":False})
          PY
          python oos_guard.py

      - name: Qualify all 37 development datasets
        shell: python
        run: |
          import time
          import continuous_runner as c
          c.configure_paths(
              "stock_fx_config.json",
              "stock_fx_state",
              "strategy_library/stock_fx_universe_plan.json",
          )
          tracks=c.build_tracks()
          unique={}
          for track in tracks:
              unique.setdefault(track["target"]["id"], track["target"])
          for i,target in enumerate(sorted(unique.values(), key=lambda x:x["id"]),1):
              print(f"[{i}/{len(unique)}] {target['id']} {target['symbol']} {target['source']}")
              c.prepare_data({"target": target})
              time.sleep(0.25)
          print(f"qualified {len(unique)} development-only datasets")
          PY

      - name: Post-data OOS contamination guard
        run: python oos_guard.py

      - name: Advance stock/FX breadth research
        run: >
          python continuous_runner.py
          --config stock_fx_config.json
          --state-dir stock_fx_state
          --universe-plan strategy_library/stock_fx_universe_plan.json
          --iters-per-visit 4
          --max-visits 6
          --max-seconds 2400
          --breadth-target 10
          --depth-target 30
          --elite-target 60
          --depth-fraction 0.25
          --elite-fraction 0.20
          --model auto

      - name: Final OOS contamination guard
        run: python oos_guard.py

      - name: Build expansion report
        shell: python
        run: |
          import json, math
          from pathlib import Path
          p=json.loads(Path("stock_fx_state/progress.json").read_text())
          b=json.loads(Path("stock_fx_state/leaderboard_latest.json").read_text())
          rows=b.get("rows",[])[:20]
          out=[
              "# Stock + FX AUTORESEARCH",
              "",
              f"Source SHA: **{__import__('os').environ.get('AUTORESEARCH_SOURCE_SHA','')}**",
              f"Phase: **{p.get('phase')}**",
              f"Tracks: **{p.get('runnable_track_count')}**",
              f"PBO ready: **{p.get('pbo_ready_track_count',0)}/{p.get('pbo_baselined_track_count',0)}**",
              f"Hidden validation allowed: **{p.get('hidden_validation_allowed_by_universe_plan')}**",
              "",
              "| # | Family | Target | Market | Profile | CAGR | Sharpe | DD | PF | PBO |",
              "|---:|---|---|---|---|---:|---:|---:|---:|---:|",
          ]
          def f(v,d=2):
              try:
                  x=float(v)
                  return f"{x:.{d}f}" if math.isfinite(x) else "—"
              except Exception:
                  return "—"
          for i,r in enumerate(rows,1):
              pbo=r.get("pbo")
              out.append(
                  f"| {i} | {r.get('family')} | {r.get('target')} | {r.get('market')} | "
                  f"{r.get('profile')} | {f(r.get('development_cagr_pct'))}% | "
                  f"{f(r.get('development_sharpe'),3)} | {f(r.get('development_max_dd_pct'))}% | "
                  f"{f(r.get('development_pf'),3)} | {f(None if pbo is None else 100*float(pbo),1)}% |"
              )
          Path("stock-fx-report.md").write_text("\n".join(out)+"\n")
          print("\n".join(out))
 
      - name: Persist stock/FX research state
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C stock-fx-autoresearch-state
          git add -f moondev_autoresearch_reconstruction/stock_fx_state
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "Stock FX autoresearch state run $GITHUB_RUN_ID"
          fi
          git push --force-with-lease origin stock-fx-autoresearch-state

      - name: Upload expansion state
        uses: actions/upload-artifact@v7
        with:
          name: stock-fx-autoresearch-${{ github.run_id }}
          path: |
            moondev_autoresearch_reconstruction/stock_fx_state/progress.json
            moondev_autoresearch_reconstruction/stock_fx_state/leaderboard_latest.json
            moondev_autoresearch_reconstruction/stock_fx_state/search_selections.json
            moondev_autoresearch_reconstruction/stock_fx_state/cycles.jsonl
            moondev_autoresearch_reconstruction/stock-fx-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Chain next stock/FX cycle
        if: success()
        shell: bash
        working-directory: .
        run: |
          phase="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("moondev_autoresearch_reconstruction/stock_fx_state/progress.json").read_text()).get("phase",""))
          PY
          )"
          if test "$phase" != "expansion_pending" && test "$phase" != "complete" && test "$phase" != "validation"; then
            gh workflow run stock-fx-autoresearch.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "stock/FX adaptive lane frozen at phase=$phase; not opening hidden validation"
          fi
