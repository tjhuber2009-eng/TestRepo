[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-tournament"
version = "0.1.0"
description = "Frozen, forward-only prediction-market strategy tournament"
requires-python = ">=3.12,<3.13"
dependencies = ["websockets==17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
