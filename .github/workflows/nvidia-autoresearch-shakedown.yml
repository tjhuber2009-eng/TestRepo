name: NVIDIA AUTORESEARCH 3-iteration shakedown

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  shakedown:
    if: >
      github.event.issue.pull_request &&
      github.event.issue.number == 13 &&
      github.event.comment.body == '/nvidia-shakedown' &&
      github.event.comment.user.login == 'tjhuber2009-eng'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: nvidia/nemotron-3-super-120b-a12b
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: moondev_autoresearch_reconstruction

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: moondev-nvidia-autoresearch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: moondev_autoresearch_reconstruction/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall -q .

      - name: Verify NVIDIA secret
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::NVIDIA_API_KEY repository secret is not available."
            exit 1
          fi
          echo "NVIDIA_API_KEY is present (value not displayed)."

      - name: Smoke test NVIDIA NIM
        run: python nvidia_smoke.py

      - name: Prepare ETH 6-hour data
        run: python prepare_data.py --asset ETH

      - name: Audit prepared data
        shell: python
        run: |
          import pandas as pd
          from pathlib import Path
          p = Path("data/ETH_6h.csv")
          df = pd.read_csv(p)
          t = pd.to_datetime(df["Date"], utc=True)
          dup = int(t.duplicated().sum())
          ordered = bool(t.is_monotonic_increasing)
          gaps = t.diff().dropna()
          unexpected = int((gaps != pd.Timedelta(hours=6)).sum())
          print(f"rows={len(df)}")
          print(f"first={t.iloc[0]}")
          print(f"last={t.iloc[-1]}")
          print(f"duplicates={dup}")
          print(f"ordered={ordered}")
          print(f"non_6h_intervals={unexpected}")
          if dup or not ordered:
              raise SystemExit("data integrity check failed")

      - name: Freeze in-sample baseline
        run: python harness.py --is --set-baseline

      - name: Preserve seed as current champion
        shell: bash
        run: |
          cp strategy.py strategy_best.py
          mkdir -p keepers logs
          cp strategy.py keepers/000_seed.py

      - name: Run exactly 3 NVIDIA AUTORESEARCH iterations
        id: research
        continue-on-error: true
        run: python loop.py --iters 3 --model "$NVIDIA_MODEL"

      - name: Build shakedown report
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json
          import csv

          lines = ["# NVIDIA AUTORESEARCH 3-iteration shakedown", ""]
          for name in ["baseline.json", "last_run.json"]:
              p = Path(name)
              if p.exists():
                  lines += [f"## {name}", "", "~~~json", p.read_text(), "~~~", ""]

          p = Path("results.tsv")
          if p.exists():
              rows = list(csv.DictReader(p.open(encoding="utf-8"), delimiter="\t"))
              lines += ["## Results", ""]
              if rows:
                  cols = ["iter","verdict","base_score","score","ret_pct","sharpe","ann_vol","trades","max_dd","guard","desc"]
                  lines.append("| " + " | ".join(cols) + " |")
                  lines.append("|" + "|".join(["---"] * len(cols)) + "|")
                  for row in rows:
                      vals = [str(row.get(c, "")).replace("|", "\\|") for c in cols]
                      lines.append("| " + " | ".join(vals) + " |")
              else:
                  lines.append("No scored rows.")
              lines.append("")

          keepers = sorted(Path("keepers").glob("*.py"))
          lines += ["## Keepers", ""]
          lines += [f"- {p.name}" for p in keepers] or ["- none"]
          lines.append("")

          logs = sorted(Path("logs").glob("*"))
          lines += ["## Logs", "", f"{len(logs)} log files produced.", ""]

          Path("SHAKEDOWN_REPORT.md").write_text("\n".join(lines), encoding="utf-8")

      - name: Upload shakedown artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-autoresearch-shakedown
          path: |
            moondev_autoresearch_reconstruction/SHAKEDOWN_REPORT.md
            moondev_autoresearch_reconstruction/baseline.json
            moondev_autoresearch_reconstruction/last_run.json
            moondev_autoresearch_reconstruction/results.tsv
            moondev_autoresearch_reconstruction/strategy.py
            moondev_autoresearch_reconstruction/strategy_best.py
            moondev_autoresearch_reconstruction/proposal.txt
            moondev_autoresearch_reconstruction/keepers/
            moondev_autoresearch_reconstruction/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment result on PR
        if: always()
        shell: bash
        run: |
          if [ -f SHAKEDOWN_REPORT.md ]; then
            {
              if [ "${{ steps.research.outcome }}" = "success" ]; then
                echo "NVIDIA AUTORESEARCH shakedown: **COMPLETED**"
              else
                echo "NVIDIA AUTORESEARCH shakedown: **FAILED/PARTIAL**"
              fi
              echo
              cat SHAKEDOWN_REPORT.md
            } > pr-comment.md
          else
            echo "NVIDIA AUTORESEARCH shakedown failed before a report could be generated." > pr-comment.md
          fi
          gh pr comment 13 --repo tjhuber2009-eng/TestRepo --body-file pr-comment.md

      - name: Fail job if research failed
        if: steps.research.outcome != 'success'
        run: exit 1
